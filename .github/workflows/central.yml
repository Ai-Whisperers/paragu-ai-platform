name: central

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: central-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: diff
        with:
          filters: |
            apps/3md-website:
              - 'apps/3md-website/**'
            apps/arnos-barber-shop:
              - 'apps/arnos-barber-shop/**'
            apps/bichos-gym:
              - 'apps/bichos-gym/**'
            apps/bufete-mendez:
              - 'apps/bufete-mendez/**'
            apps/camilo-acosta:
              - 'apps/camilo-acosta/**'
            apps/cronos-academy:
              - 'apps/cronos-academy/**'
            apps/cuidadoamiga:
              - 'apps/cuidadoamiga/**'
            apps/de-abasto-a-casa:
              - 'apps/de-abasto-a-casa/**'
            apps/escribania-paraguay:
              - 'apps/escribania-paraguay/**'
            apps/estudio-medieval:
              - 'apps/estudio-medieval/**'
            apps/fun4me:
              - 'apps/fun4me/**'
            apps/fun4me-store:
              - 'apps/fun4me-store/**'
            apps/golden-visa-advisory:
              - 'apps/golden-visa-advisory/**'
            apps/granja-cabral:
              - 'apps/granja-cabral/**'
            apps/hidrobaby-spa:
              - 'apps/hidrobaby-spa/**'
            apps/jota-ink-tattoo:
              - 'apps/jota-ink-tattoo/**'
            apps/luis-de-leon-concept:
              - 'apps/luis-de-leon-concept/**'
            apps/magnolia-peluqueria:
              - 'apps/magnolia-peluqueria/**'
            apps/mantraspa:
              - 'apps/mantraspa/**'
            apps/meal-prep:
              - 'apps/meal-prep/**'
            apps/nexa-paraguay:
              - 'apps/nexa-paraguay/**'
            apps/nde-barba:
              - 'apps/nde-barba/**'
            apps/nudo:
              - 'apps/nudo/**'
            apps/ozmontania-website:
              - 'apps/ozmontania-website/**'
            apps/pitchy-website:
              - 'apps/pitchy-website/**'
            apps/portas-barber:
              - 'apps/portas-barber/**'
            apps/reina-de-copas:
              - 'apps/reina-de-copas/**'
            apps/scott-tatuajes:
              - 'apps/scott-tatuajes/**'
            apps/shine-nails:
              - 'apps/shine-nails/**'
            apps/trentina-cerveza:
              - 'apps/trentina-cerveza/**'
            apps/trentina-site:
              - 'apps/trentina-site/**'
            apps/tsuki-restaurante:
              - 'apps/tsuki-restaurante/**'
            apps/villamayor-asociados:
              - 'apps/villamayor-asociados/**'
            apps/xxgym:
              - 'apps/xxgym/**'
      - name: Emit changed apps
        id: emit
        run: |
          # dorny/paths-filter exposes one output per filter key (app name).
          # We hardcode the list of apps here and read each output by name.
          APPS_LIST="3md-website arnos-barber-shop bichos-gym bufete-mendez camilo-acosta cronos-academy cuidadoamiga de-abasto-a-casa escribania-paraguay estudio-medieval fun4me fun4me-store golden-visa-advisory granja-cabral hidrobaby-spa jota-ink-tattoo luis-de-leon-concept magnolia-peluqueria mantraspa meal-prep nexa-paraguay nde-barba nudo ozmontania-website pitchy-website portas-barber reina-de-copas scott-tatuajes tsuki-restaurante villamayor-asociados xxgym"
          CHANGED=""
          for app in $APPS_LIST; do
            # steps.diff.outputs.<app> is templated by GitHub Actions
            # (the variable name `app` in the expression refers to the matrix/job context,
            # not the shell loop variable — so we list every key explicitly)
            case "$app" in
              3md-website)             [ "${{ steps.diff.outputs['3md-website'] }}"             = "true" ] && CHANGED="$CHANGED,$app" ;;
              arnos-barber-shop)       [ "${{ steps.diff.outputs['arnos-barber-shop'] }}"       = "true" ] && CHANGED="$CHANGED,$app" ;;
              bichos-gym)               [ "${{ steps.diff.outputs['bichos-gym'] }}"               = "true" ] && CHANGED="$CHANGED,$app" ;;
              bufete-mendez)            [ "${{ steps.diff.outputs['bufete-mendez'] }}"            = "true" ] && CHANGED="$CHANGED,$app" ;;
              camilo-acosta)            [ "${{ steps.diff.outputs['camilo-acosta'] }}"            = "true" ] && CHANGED="$CHANGED,$app" ;;
              cronos-academy)           [ "${{ steps.diff.outputs['cronos-academy'] }}"           = "true" ] && CHANGED="$CHANGED,$app" ;;
              cuidadoamiga)             [ "${{ steps.diff.outputs['cuidadoamiga'] }}"             = "true" ] && CHANGED="$CHANGED,$app" ;;
              de-abasto-a-casa)         [ "${{ steps.diff.outputs['de-abasto-a-casa'] }}"         = "true" ] && CHANGED="$CHANGED,$app" ;;
              escribania-paraguay)      [ "${{ steps.diff.outputs['escribania-paraguay'] }}"      = "true" ] && CHANGED="$CHANGED,$app" ;;
              estudio-medieval)        [ "${{ steps.diff.outputs['estudio-medieval'] }}"        = "true" ] && CHANGED="$CHANGED,$app" ;;
              fun4me)                  [ "${{ steps.diff.outputs['fun4me'] }}"                  = "true" ] && CHANGED="$CHANGED,$app" ;;
              fun4me-store)            [ "${{ steps.diff.outputs['fun4me-store'] }}"            = "true" ] && CHANGED="$CHANGED,$app" ;;
              golden-visa-advisory)     [ "${{ steps.diff.outputs['golden-visa-advisory'] }}"     = "true" ] && CHANGED="$CHANGED,$app" ;;
              granja-cabral)            [ "${{ steps.diff.outputs['granja-cabral'] }}"            = "true" ] && CHANGED="$CHANGED,$app" ;;
              hidrobaby-spa)            [ "${{ steps.diff.outputs['hidrobaby-spa'] }}"            = "true" ] && CHANGED="$CHANGED,$app" ;;
              jota-ink-tattoo)          [ "${{ steps.diff.outputs['jota-ink-tattoo'] }}"          = "true" ] && CHANGED="$CHANGED,$app" ;;
              luis-de-leon-concept)     [ "${{ steps.diff.outputs['luis-de-leon-concept'] }}"     = "true" ] && CHANGED="$CHANGED,$app" ;;
              magnolia-peluqueria)      [ "${{ steps.diff.outputs['magnolia-peluqueria'] }}"      = "true" ] && CHANGED="$CHANGED,$app" ;;
              mantraspa)                [ "${{ steps.diff.outputs['mantraspa'] }}"                = "true" ] && CHANGED="$CHANGED,$app" ;;
              meal-prep)                [ "${{ steps.diff.outputs['meal-prep'] }}"                = "true" ] && CHANGED="$CHANGED,$app" ;;
              nexa-paraguay)            [ "${{ steps.diff.outputs['nexa-paraguay'] }}"            = "true" ] && CHANGED="$CHANGED,$app" ;;
              nde-barba)                [ "${{ steps.diff.outputs['nde-barba'] }}"                = "true" ] && CHANGED="$CHANGED,$app" ;;
              nudo)                     [ "${{ steps.diff.outputs['nudo'] }}"                     = "true" ] && CHANGED="$CHANGED,$app" ;;
              ozmontania-website)       [ "${{ steps.diff.outputs['ozmontania-website'] }}"       = "true" ] && CHANGED="$CHANGED,$app" ;;
              pitchy-website)           [ "${{ steps.diff.outputs['pitchy-website'] }}"           = "true" ] && CHANGED="$CHANGED,$app" ;;
              portas-barber)            [ "${{ steps.diff.outputs['portas-barber'] }}"            = "true" ] && CHANGED="$CHANGED,$app" ;;
              reina-de-copas)           [ "${{ steps.diff.outputs['reina-de-copas'] }}"           = "true" ] && CHANGED="$CHANGED,$app" ;;
              scott-tatuajes)           [ "${{ steps.diff.outputs['scott-tatuajes'] }}"           = "true" ] && CHANGED="$CHANGED,$app" ;;
              tsuki-restaurante)        [ "${{ steps.diff.outputs['tsuki-restaurante'] }}"        = "true" ] && CHANGED="$CHANGED,$app" ;;
              villamayor-asociados)     [ "${{ steps.diff.outputs['villamayor-asociados'] }}"     = "true" ] && CHANGED="$CHANGED,$app" ;;
              xxgym)                    [ "${{ steps.diff.outputs['xxgym'] }}"                    = "true" ] && CHANGED="$CHANGED,$app" ;;
            esac
          done
          # Strip leading comma
          CHANGED="${CHANGED#,}"
          echo "apps=$CHANGED" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    needs: detect-apps
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./apps/${{ matrix.app }}" run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: detect-apps
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./apps/${{ matrix.app }}" run typecheck || echo 'typecheck script not defined'

  build:
    runs-on: ubuntu-latest
    needs: detect-apps
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm --filter "./apps/${{ matrix.app }}" build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/.next/

  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [detect-apps, build]
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: apps/${{ matrix.app }}/.next/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile.standalone
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:standalone-${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [detect-apps, docker]
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy to VPS
        run: |
          APP="${{ matrix.app }}"
          IMAGE="ghcr.io/${{ github.repository }}/${APP}:${{ github.sha }}"
          # Map app name to Docker Swarm service name
          case "$APP" in
            golden-visa-advisory)  SVC="golden-visa-advisory_web" ;;
            pitchy-website)        SVC="pitchy-website_web" ;;
            trentina-cerveza)      SVC="trentina-cerveza_web" ;;
            ozmontania-website)    SVC="ozmontania-website_web" ;;
            nde-barba)             SVC="nde-barba_web" ;;
            nexa-paraguay)         SVC="nexa-paraguay_web" ;;
            nudo)                  SVC="nudo_web" ;;
            hidrobaby-spa)          SVC="hidrobaby-spa_web" ;;
            arnos-barber-shop)    SVC="arnos-barber-shop_web" ;;
            cronos-academy)        SVC="cronos-academy_web" ;;
            scott-tatuajes)         SVC="scott-tatuajes_web" ;;
            jota-ink-tattoo)        SVC="jota-ink_web" ;;
            magnolia-peluqueria)     SVC="magnolia_web" ;;
            meal-prep)             SVC="meal-prep_web" ;;
            *)                     SVC="${APP}_web" ;;
          esac
          ssh -o StrictHostKeyChecking=accept-new root@72.61.44.159 "
            docker pull ${IMAGE} &&
            docker service update --image ${IMAGE} ${SVC} --with-registry-auth 2>&1
          "