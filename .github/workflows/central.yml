name: central

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: central-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/ai-whisperers/paragu-ai-platform

permissions:
  contents: read
  packages: write

jobs:
  detect-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.emit.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: diff
        with:
          filters: |
            apps/3md-website:
              - 'apps/3md-website/**'
            apps/bichos-gym:
              - 'apps/bichos-gym/**'
            apps/bufete-mendez:
              - 'apps/bufete-mendez/**'
            apps/builder:
              - 'apps/builder/**'
            apps/camilo-acosta:
              - 'apps/camilo-acosta/**'
            apps/de-abasto-a-casa:
              - 'apps/de-abasto-a-casa/**'
            apps/escribania-paraguay:
              - 'apps/escribania-paraguay/**'
            apps/estudio-medieval:
              - 'apps/estudio-medieval/**'
            apps/fun4me:
              - 'apps/fun4me/**'
            apps/fun4me-store:
              - 'apps/fun4me-store/**'
            apps/golden-visa-advisory:
              - 'apps/golden-visa-advisory/**'
            apps/granja-cabral:
              - 'apps/granja-cabral/**'
            apps/jota-ink-tattoo:
              - 'apps/jota-ink-tattoo/**'
            apps/luis-de-leon-concept:
              - 'apps/luis-de-leon-concept/**'
            apps/magnolia-peluqueria:
              - 'apps/magnolia-peluqueria/**'
            apps/mantraspa:
              - 'apps/mantraspa/**'
            apps/meal-prep:
              - 'apps/meal-prep/**'
            apps/nde-barba:
              - 'apps/nde-barba/**'
            apps/nexa-paraguay:
              - 'apps/nexa-paraguay/**'
            apps/ozmontania-website:
              - 'apps/ozmontania-website/**'
            apps/pitchy-website:
              - 'apps/pitchy-website/**'
            apps/portas-barber:
              - 'apps/portas-barber/**'
            apps/reina-de-copas:
              - 'apps/reina-de-copas/**'
            apps/shine-nails:
              - 'apps/shine-nails/**'
            apps/trentina-cerveza:
              - 'apps/trentina-cerveza/**'
            apps/trentina-site:
              - 'apps/trentina-site/**'
            apps/tsuki-restaurante:
              - 'apps/tsuki-restaurante/**'
            apps/villamayor-asociados:
              - 'apps/villamayor-asociados/**'
            apps/xxgym:
              - 'apps/xxgym/**'
      - name: Emit changed apps
        id: emit
        run: |
          APPS=""
          OUTPUTS='${{ toJson(steps.diff.outputs) }}'
          for app in 3md-website bichos-gym bufete-mendez builder camilo-acosta de-abasto-a-casa escribania-paraguay estudio-medieval fun4me fun4me-store golden-visa-advisory granja-cabral jota-ink-tattoo luis-de-leon-concept magnolia-peluqueria mantraspa meal-prep nde-barba nexa-paraguay ozmontania-website pitchy-website portas-barber reina-de-copas shine-nails trentina-cerveza trentina-site tsuki-restaurante villamayor-asociados xxgym; do
            VAL=$(echo "$OUTPUTS" | jq -r --arg k "apps/$app" '.[$k] // "false"')
            if [ "$VAL" = "true" ]; then
              if [ -z "$APPS" ]; then APPS="$app"; else APPS="$APPS,$app"; fi
            fi
          done
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    needs: detect-apps
    if: needs.detect-apps.outputs.apps != ''
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./apps/${{ matrix.app }}" run lint || true

  typecheck:
    runs-on: ubuntu-latest
    needs: detect-apps
    if: needs.detect-apps.outputs.apps != ''
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./apps/${{ matrix.app }}" run typecheck || true

  build:
    runs-on: ubuntu-latest
    needs: detect-apps
    if: needs.detect-apps.outputs.apps != ''
    outputs:
      apps: ${{ needs.detect-apps.outputs.apps }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter "./apps/${{ matrix.app }}" build

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      apps: ${{ needs.build.outputs.apps }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.build.outputs.apps || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build app
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter "./apps/${{ matrix.app }}" build
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          APP="${{ matrix.app }}"
          SHA="${{ github.sha }}"
          IMAGE="${{ env.IMAGE_BASE }}/${APP}"
          DF="apps/${APP}/Dockerfile.standalone"
          [ -f "$DF" ] || DF="apps/${APP}/Dockerfile"
          docker build -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" -f "$DF" .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.docker-build.outputs.apps || '[]') }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP="${{ matrix.app }}"
            IMAGE="${{ env.IMAGE_BASE }}/${APP}"
            SHA="${{ github.sha }}"
            SVC="${APP}_web"
            
            echo "Deploying ${APP}@${SHA}..."
            
            # Pull the new image
            docker pull "${IMAGE}:${SHA}"
            docker tag "${IMAGE}:${SHA}" "${APP}:prod"
            
            # Update service (with agent-net network fix)
            docker service update --image "${APP}:prod" \
              --network-add agent-net \
              "${SVC}" || {
              echo "Service ${SVC} not found, creating..."
              docker service create --name "${SVC}" --replicas 2 \
                --network agent-net \
                --label "traefik.enable=true" \
                --label "traefik.http.routers.${APP}.entrypoints=websecure" \
                --label "traefik.http.routers.${APP}.rule=Host(\`${APP}.paragu-ai.com\`)" \
                --label "traefik.http.routers.${APP}.tls=true" \
                --label "traefik.http.routers.${APP}.tls.certresolver=letsencryptresolver" \
                --label "traefik.http.services.${APP}.loadbalancer.server.port=3000" \
                --constraint "node.role==manager" \
                "${APP}:prod"
            }
            
            # Wait for convergence
            sleep 10
            
            # Smoke test
            STATUS=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 8 "http://127.0.0.1:$(docker service ps ${SVC} --format '{{.Ports}}' | head -1 | grep -oP '0\.0\.0\.0:\K[0-9]+' | head -1)/" 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "✅ ${APP} deployed and responding (200)"
            else
              echo "⚠️ ${APP} returned ${STATUS} - manual check needed"
            fi
