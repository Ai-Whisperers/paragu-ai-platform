<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Dra. Gabriella — odontología conservadora">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#0f4c4c" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0f4c4c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="0.7" fill="#ffffff" fill-opacity="0.05"/>
      <circle cx="80" cy="120" r="0.5" fill="#ffffff" fill-opacity="0.04"/>
      <circle cx="160" cy="40" r="0.6" fill="#ffffff" fill-opacity="0.05"/>
      <circle cx="120" cy="180" r="0.4" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <!-- Soft abstract tooth shape -->
  <g transform="translate(1100 200)" fill="#ffffff" fill-opacity="0.06" stroke="#c9a84c" stroke-opacity="0.4" stroke-width="2">
    <path d="M120 0 C 60 0, 30 60, 50 130 L 80 320 C 90 380, 110 400, 130 400 C 150 400, 170 380, 180 320 L 210 130 C 230 60, 200 0, 140 0 Z"/>
  </g>
  <g transform="translate(220 600)" fill="#c9a84c" fill-opacity="0.2">
    <circle cx="0" cy="0" r="120"/>
    <circle cx="160" cy="40" r="60"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Georgia, serif" fill="#ffffff">
    <text x="120" y="440" font-size="92" font-weight="400" letter-spacing="-2">Odontología</text>
    <text x="120" y="540" font-size="92" font-weight="400" letter-spacing="-2">con criterio.</text>
  </g>
  <text x="120" y="610" font-family="Inter, sans-serif" font-size="24" fill="#c9a84c" letter-spacing="6">DRA · GABRIELLA · GONZÁLEZ PANE</text>
  <line x1="120" y1="660" x2="280" y2="660" stroke="#c9a84c" stroke-width="2"/>
  <text x="120" y="710" font-family="Inter, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.7">Asunción · Paraguay · 20+ años</text>
</svg>
