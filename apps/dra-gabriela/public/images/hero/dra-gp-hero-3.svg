<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Segundas opiniones honestas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3a3a"/>
      <stop offset="1" stop-color="#0f4c4c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <!-- Two overlapping documents (second opinion visual) -->
  <g transform="translate(900 200)">
    <rect x="40" y="40" width="380" height="500" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" rx="12"/>
    <rect x="0" y="0" width="380" height="500" fill="#ffffff" fill-opacity="0.92" stroke="#e7e2d8" stroke-width="1" rx="12"/>
    <g transform="translate(40 60)">
      <rect x="0" y="0" width="160" height="10" fill="#0f4c4c" rx="3"/>
      <rect x="0" y="40" width="300" height="4" fill="#6b5e52" rx="2"/>
      <rect x="0" y="60" width="280" height="4" fill="#6b5e52" rx="2"/>
      <rect x="0" y="80" width="240" height="4" fill="#6b5e52" rx="2"/>
      <rect x="0" y="120" width="300" height="80" fill="#fbf9f6" rx="6"/>
      <rect x="20" y="140" width="100" height="4" fill="#0f4c4c" rx="2"/>
      <rect x="20" y="160" width="240" height="3" fill="#9a8c7e" rx="2"/>
      <rect x="0" y="220" width="300" height="80" fill="#e6efef" rx="6"/>
      <rect x="20" y="240" width="100" height="4" fill="#0f4c4c" rx="2"/>
      <rect x="20" y="260" width="220" height="3" fill="#6b5e52" rx="2"/>
      <rect x="0" y="320" width="120" height="32" fill="#c9a84c" rx="4"/>
    </g>
  </g>
  <!-- Text -->
  <g font-family="Georgia, serif" fill="#ffffff">
    <text x="120" y="280" font-size="78" font-weight="400" letter-spacing="-2">Segundas</text>
    <text x="120" y="370" font-size="78" font-weight="400" letter-spacing="-2">opiniones</text>
    <text x="120" y="460" font-size="78" font-weight="400" letter-spacing="-2" fill="#c9a84c">honestas.</text>
  </g>
  <line x1="120" y1="540" x2="280" y2="540" stroke="#c9a84c" stroke-width="2"/>
  <text x="120" y="600" font-family="Inter, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.85">Sin conflicto de interés · plan escrito</text>
  <text x="120" y="640" font-family="Inter, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.85">Revisamos tu caso en 2–3 días</text>
</svg>
