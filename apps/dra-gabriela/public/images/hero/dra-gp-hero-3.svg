<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="X-ray and second opinion review">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="0.5" stop-color="#f0e8d4"/>
      <stop offset="1" stop-color="#d4c8a8"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89c80"/>
      <stop offset="1" stop-color="#7a6c4c"/>
    </linearGradient>
    <linearGradient id="xray-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2828"/>
      <stop offset="1" stop-color="#0a1010"/>
    </linearGradient>
    <radialGradient id="window" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#d4cfc4"/>
    </linearGradient>
    <radialGradient id="coffee-liquid" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a2818"/>
      <stop offset="1" stop-color="#2a1808"/>
    </radialGradient>
    <filter id="frame-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.3"/>
    </filter>
    <filter id="obj-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm light from right (window) -->
  <rect width="1600" height="900" fill="url(#window)"/>
  <!-- Desk surface (lower half) -->
  <rect y="640" width="1600" height="260" fill="url(#desk)"/>
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#5a4830" stroke-width="2"/>
  <!-- Wood grain -->
  <g stroke="#5a4830" stroke-width="0.5" opacity="0.3">
    <path d="M 0 700 Q 800 695, 1600 705"/>
    <path d="M 0 750 Q 800 745, 1600 755"/>
    <path d="M 0 820 Q 800 825, 1600 815"/>
  </g>
  <!-- X-ray light box (large, left) -->
  <g transform="translate(140 180)" filter="url(#frame-shadow)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="540" height="640" fill="#0f0f0f" rx="8"/>
    <rect x="6" y="6" width="528" height="628" fill="url(#xray-bg)" rx="6"/>
    <!-- Header label -->
    <text x="20" y="34" font-family="Inter, sans-serif" font-size="11" fill="#c9a84c" letter-spacing="3" font-weight="600">PANORÁMICA · 2026</text>
    <text x="20" y="50" font-family="Inter, sans-serif" font-size="9" fill="#7a8480" letter-spacing="2">DRA · GABRIELLA · ORTODONCIA</text>
    <!-- Panoramic dental X-ray shape -->
    <g transform="translate(270 320)" fill="none" stroke="#e8e8e8" stroke-width="1" opacity="0.9">
      <!-- Mandible outline -->
      <path d="M -200 -40 Q -210 60, -160 100 Q -100 130, -50 110 L 0 90 L 50 110 Q 100 130, 160 100 Q 210 60, 200 -40 L 190 -50 L 170 -45 L 150 -55 L 130 -45 L 110 -55 L 90 -45 L 70 -55 L 50 -45 L 30 -55 L 10 -45 L -10 -55 L -30 -45 L -50 -55 L -70 -45 L -90 -55 L -110 -45 L -130 -55 L -150 -45 L -170 -55 L -190 -50 Z"/>
    </g>
    <!-- Teeth highlights (filled with light) -->
    <g fill="#e8e8e8" opacity="0.65">
      <ellipse cx="170" cy="40" rx="10" ry="14"/>
      <ellipse cx="145" cy="55" rx="9" ry="12"/>
      <ellipse cx="118" cy="60" rx="9" ry="12"/>
      <ellipse cx="90" cy="62" rx="9" ry="12"/>
      <ellipse cx="60" cy="62" rx="9" ry="12"/>
      <ellipse cx="30" cy="62" rx="9" ry="12"/>
      <ellipse cx="0" cy="62" rx="9" ry="12"/>
      <ellipse cx="-30" cy="62" rx="9" ry="12"/>
      <ellipse cx="-60" cy="62" rx="9" ry="12"/>
      <ellipse cx="-90" cy="60" rx="9" ry="12"/>
      <ellipse cx="-118" cy="60" rx="9" ry="12"/>
      <ellipse cx="-145" cy="55" rx="9" ry="12"/>
      <ellipse cx="-170" cy="40" rx="10" ry="14"/>
    </g>
    <!-- Highlighted tooth (where attention is focused) -->
    <ellipse cx="60" cy="62" rx="14" ry="18" fill="none" stroke="#c9a84c" stroke-width="2" stroke-dasharray="3 2" opacity="0.9"/>
    <!-- Bottom label -->
    <text x="20" y="610" font-family="Inter, sans-serif" font-size="9" fill="#5a6060" letter-spacing="2" opacity="0.6">PANORAMA #00234 · PACIENTE CONFIDENCIAL</text>
  </g>
  <!-- Magnifying glass -->
  <g transform="translate(620 540)" filter="url(#obj-shadow)">
    <circle cx="0" cy="0" r="90" fill="rgba(15,76,76,0.3)" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <!-- Handle -->
    <line x1="64" y1="64" x2="130" y2="130" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="130" y2="130" stroke="rgba(0,0,0,0.3)" stroke-width="2" stroke-linecap="round" transform="translate(2 2)"/>
    <!-- Highlight inside glass -->
    <ellipse cx="-30" cy="-30" rx="20" ry="8" fill="rgba(255,255,255,0.2)"/>
  </g>
  <!-- Notebook on desk -->
  <g transform="translate(900 660)" filter="url(#obj-shadow)">
    <rect x="0" y="0" width="400" height="160" fill="url(#accent)" rx="4"/>
    <rect x="0" y="0" width="400" height="6" fill="url(#gold)"/>
    <!-- Spine -->
    <rect x="0" y="0" width="14" height="160" fill="#0a3a3a" rx="2"/>
    <!-- Lines -->
    <g transform="translate(40 30)">
      <rect x="0" y="0" width="320" height="4" fill="#c9a84c" opacity="0.6"/>
      <rect x="0" y="14" width="280" height="4" fill="#c9a84c" opacity="0.4"/>
      <rect x="0" y="28" width="300" height="4" fill="#c9a84c" opacity="0.4"/>
      <rect x="0" y="42" width="240" height="4" fill="#c9a84c" opacity="0.4"/>
    </g>
    <!-- Title -->
    <text x="220" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c9a84c" letter-spacing="3" font-style="italic">written plan</text>
  </g>
  <!-- Coffee cup -->
  <g transform="translate(1380 720)">
    <!-- Shadow -->
    <ellipse cx="0" cy="50" rx="55" ry="8" fill="#000" opacity="0.3"/>
    <!-- Cup body -->
    <path d="M -50 -40 L -45 50 Q -45 60, -35 60 L 35 60 Q 45 60, 45 50 L 50 -40 Z" fill="url(#coffee)" stroke="#a89c80" stroke-width="1"/>
    <!-- Saucer -->
    <ellipse cx="0" cy="60" rx="65" ry="10" fill="url(#coffee)" stroke="#a89c80" stroke-width="1"/>
    <!-- Coffee surface -->
    <ellipse cx="0" cy="-40" rx="50" ry="10" fill="url(#coffee-liquid)"/>
    <!-- Steam -->
    <path d="M -15 -65 Q -10 -85, -15 -105 Q -20 -125, -15 -140" stroke="#c9a84c" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 0 -65 Q 5 -85, 0 -105 Q -5 -125, 0 -140" stroke="#c9a84c" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 15 -65 Q 20 -85, 15 -105 Q 10 -125, 15 -140" stroke="#c9a84c" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  <!-- Subtle floor highlight -->
  <g opacity="0.2">
    <ellipse cx="800" cy="850" rx="500" ry="20" fill="#fff"/>
  </g>
</svg>
