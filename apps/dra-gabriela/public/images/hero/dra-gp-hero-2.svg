<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Planificamos antes de actuar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#efede8"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#b08f38"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Document / plan visual -->
  <g transform="translate(900 130)">
    <rect x="0" y="0" width="500" height="640" fill="#ffffff" stroke="#e7e2d8" stroke-width="2" rx="20"/>
    <rect x="40" y="40" width="200" height="14" fill="#0f4c4c" rx="4"/>
    <rect x="40" y="80" width="420" height="6" fill="#9a8c7e" rx="3"/>
    <rect x="40" y="100" width="380" height="6" fill="#9a8c7e" rx="3"/>
    <rect x="40" y="160" width="420" height="100" fill="#e6efef" rx="8"/>
    <rect x="60" y="180" width="120" height="6" fill="#0f4c4c" rx="3"/>
    <rect x="60" y="200" width="320" height="4" fill="#6b5e52" rx="2"/>
    <rect x="60" y="220" width="280" height="4" fill="#6b5e52" rx="2"/>
    <rect x="40" y="290" width="420" height="100" fill="#fbf9f6" stroke="#c9a84c" stroke-width="1.5" rx="8"/>
    <rect x="60" y="310" width="160" height="6" fill="#c9a84c" rx="3"/>
    <rect x="60" y="330" width="320" height="4" fill="#6b5e52" rx="2"/>
    <rect x="60" y="350" width="260" height="4" fill="#6b5e52" rx="2"/>
    <rect x="40" y="420" width="420" height="100" fill="#e6efef" rx="8"/>
    <rect x="60" y="440" width="120" height="6" fill="#0f4c4c" rx="3"/>
    <rect x="60" y="460" width="320" height="4" fill="#6b5e52" rx="2"/>
    <rect x="60" y="480" width="280" height="4" fill="#6b5e52" rx="2"/>
    <rect x="40" y="560" width="200" height="40" fill="url(#goldBar)" rx="6"/>
  </g>
  <!-- Text -->
  <g font-family="Georgia, serif" fill="#1c1c1c">
    <text x="120" y="280" font-size="78" font-weight="400" letter-spacing="-2">Planificamos</text>
    <text x="120" y="370" font-size="78" font-weight="400" letter-spacing="-2">antes de</text>
    <text x="120" y="460" font-size="78" font-weight="400" letter-spacing="-2">actuar.</text>
  </g>
  <text x="120" y="540" font-family="Inter, sans-serif" font-size="20" fill="#6b5e52">Diagnóstico → opciones → presupuesto escrito → decisión</text>
  <line x1="120" y1="600" x2="280" y2="600" stroke="#c9a84c" stroke-width="2"/>
  <text x="120" y="650" font-family="Inter, sans-serif" font-size="18" fill="#9a8c7e">Sin letra chica · sin apuro</text>
</svg>
