<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Calm dental consultation moment">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3a3a"/>
      <stop offset="0.6" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#1a6a6a"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg2)"/>
  <rect width="800" height="1000" fill="url(#warm)"/>
  <rect width="800" height="1000" fill="url(#vignette)"/>
  <!-- Treatment plan / document on table -->
  <g transform="translate(160 360)">
    <rect x="0" y="0" width="480" height="320" fill="#fbf9f6" rx="6" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.4))"/>
    <rect x="0" y="0" width="480" height="40" fill="#0f4c4c" rx="6"/>
    <rect x="0" y="34" width="480" height="6" fill="#0f4c4c"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" fill="#c9a84c" letter-spacing="3" font-weight="600">PLAN DE TRATAMIENTO</text>
    <text x="460" y="28" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#fbf9f6" opacity="0.6">DRA · GP</text>
    <!-- Lines on document -->
    <g transform="translate(30 70)">
      <rect x="0" y="0" width="180" height="10" fill="#1c1c1c" rx="2"/>
      <rect x="0" y="20" width="380" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="30" width="350" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="40" width="320" height="3" fill="#9a8c7e" rx="1"/>
    </g>
    <g transform="translate(30 130)">
      <rect x="0" y="0" width="60" height="6" fill="#0f4c4c" rx="2"/>
      <rect x="80" y="0" width="280" height="3" fill="#c9a84c" rx="1"/>
      <rect x="0" y="14" width="60" height="6" fill="#0f4c4c" rx="2"/>
      <rect x="80" y="14" width="260" height="3" fill="#c9a84c" rx="1"/>
      <rect x="0" y="28" width="60" height="6" fill="#0f4c4c" rx="2"/>
      <rect x="80" y="28" width="240" height="3" fill="#c9a84c" rx="1"/>
    </g>
    <g transform="translate(30 200)">
      <rect x="0" y="0" width="100" height="6" fill="#0f4c4c" rx="2"/>
      <rect x="0" y="14" width="380" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="24" width="360" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="34" width="340" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="44" width="320" height="3" fill="#9a8c7e" rx="1"/>
    </g>
    <!-- Signature line -->
    <line x1="320" y1="280" x2="440" y2="280" stroke="#1c1c1c" stroke-width="1.5"/>
    <text x="380" y="298" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#9a8c7e" font-style="italic">Dra. Gabriella</text>
  </g>
  <!-- Pen -->
  <g transform="translate(540 720) rotate(-25)">
    <rect x="0" y="0" width="180" height="14" fill="#0f4c4c" rx="2"/>
    <rect x="0" y="0" width="30" height="14" fill="#c9a84c" rx="2"/>
    <polygon points="180,0 200,7 180,14" fill="#c9a84c"/>
  </g>
  <!-- Floor reflection -->
  <ellipse cx="400" cy="940" rx="280" ry="14" fill="#000" opacity="0.3"/>
</svg>
