<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Plan de tratamiento escrito">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3a3a"/>
      <stop offset="0.6" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#1a6a6a"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-opacity="0.4"/>
    </filter>
    <filter id="pen-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#warm)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
  <!-- Atmospheric particles -->
  <g fill="#c9a84c" opacity="0.3">
    <circle cx="200" cy="150" r="1.5"/>
    <circle cx="1400" cy="200" r="1"/>
    <circle cx="1500" cy="700" r="1.5"/>
    <circle cx="100" cy="800" r="1"/>
  </g>
  <!-- Document — large -->
  <g transform="translate(280 200)" filter="url(#paper-shadow)">
    <rect x="0" y="0" width="900" height="600" fill="url(#paper)" rx="8"/>
    <!-- Header band -->
    <rect x="0" y="0" width="900" height="80" fill="url(#accent)" rx="8"/>
    <rect x="0" y="74" width="900" height="6" fill="url(#accent)"/>
    <text x="40" y="50" font-family="Inter, sans-serif" font-size="20" fill="#c9a84c" letter-spacing="5" font-weight="700">PLAN DE TRATAMIENTO</text>
    <text x="860" y="50" text-anchor="end" font-family="Inter, sans-serif" font-size="14" fill="#fbf9f6" opacity="0.7">DRA · GP</text>
    <text x="860" y="68" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#fbf9f6" opacity="0.5">Junio 2026</text>
    <!-- Section 1: Patient info -->
    <g transform="translate(40 110)">
      <rect x="0" y="0" width="220" height="10" fill="#1c1c1c" rx="2"/>
      <rect x="0" y="22" width="500" height="4" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="34" width="450" height="4" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="46" width="420" height="4" fill="#9a8c7e" rx="1"/>
    </g>
    <!-- Section 2: Diagnosis -->
    <g transform="translate(40 200)">
      <rect x="0" y="0" width="60" height="8" fill="url(#accent)" rx="2"/>
      <rect x="80" y="2" width="350" height="4" fill="#c9a84c" rx="1"/>
      <rect x="0" y="20" width="500" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="30" width="480" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="40" width="420" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="50" width="450" height="3" fill="#9a8c7e" rx="1"/>
    </g>
    <!-- Section 3: Plan items (highlighted) -->
    <g transform="translate(40 290)">
      <rect x="0" y="0" width="820" height="140" fill="#c9a84c" fill-opacity="0.12" rx="6"/>
      <rect x="0" y="0" width="820" height="140" fill="none" stroke="url(#gold)" stroke-width="1.5" rx="6"/>
      <!-- Checkmark items -->
      <g transform="translate(20 24)">
        <circle cx="8" cy="8" r="8" fill="url(#accent)"/>
        <path d="M 4 8 L 7 11 L 12 5" stroke="#c9a84c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="24" y="4" width="240" height="4" fill="#0f4c4c" rx="1"/>
        <rect x="24" y="12" width="160" height="3" fill="#c9a84c" rx="1"/>
      </g>
      <g transform="translate(20 56)">
        <circle cx="8" cy="8" r="8" fill="url(#accent)"/>
        <path d="M 4 8 L 7 11 L 12 5" stroke="#c9a84c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="24" y="4" width="280" height="4" fill="#0f4c4c" rx="1"/>
        <rect x="24" y="12" width="200" height="3" fill="#c9a84c" rx="1"/>
      </g>
      <g transform="translate(20 88)">
        <circle cx="8" cy="8" r="8" fill="url(#accent)"/>
        <path d="M 4 8 L 7 11 L 12 5" stroke="#c9a84c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="24" y="4" width="220" height="4" fill="#0f4c4c" rx="1"/>
        <rect x="24" y="12" width="180" height="3" fill="#c9a84c" rx="1"/>
      </g>
    </g>
    <!-- Section 4: Pricing note -->
    <g transform="translate(40 450)">
      <rect x="0" y="0" width="120" height="6" fill="url(#accent)" rx="2"/>
      <rect x="0" y="18" width="500" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="28" width="460" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="38" width="400" height="3" fill="#9a8c7e" rx="1"/>
    </g>
    <!-- Signature line -->
    <g transform="translate(550 530)">
      <line x1="0" y1="0" x2="200" y2="0" stroke="#1c1c1c" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1c1c1c" font-style="italic">Dra. Gabriella</text>
      <text x="100" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#9a8c7e" letter-spacing="2">DRA · GABRIELLA GONZÁLEZ PANE</text>
    </g>
  </g>
  <!-- Pen -->
  <g transform="translate(1080 720) rotate(-25)" filter="url(#pen-shadow)">
    <!-- Pen body -->
    <rect x="0" y="0" width="280" height="22" fill="url(#accent)" rx="3"/>
    <rect x="0" y="0" width="280" height="3" fill="url(#gold)"/>
    <!-- Pen tip / nib -->
    <polygon points="280,0 320,11 280,22" fill="url(#gold)"/>
    <!-- Pen clip -->
    <rect x="60" y="3" width="60" height="3" fill="url(#gold)"/>
    <rect x="60" y="16" width="60" height="3" fill="url(#gold)"/>
    <!-- Logo on pen -->
    <text x="180" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a84c" letter-spacing="1" font-style="italic">DRA</text>
  </g>
  <!-- Floor reflection -->
  <ellipse cx="800" cy="850" rx="400" ry="14" fill="#000" opacity="0.3"/>
</svg>
