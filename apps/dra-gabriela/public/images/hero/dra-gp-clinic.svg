<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Modern dental clinic in Asunción">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f1ea"/>
      <stop offset="1" stop-color="#d8d0c0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89c80"/>
      <stop offset="1" stop-color="#6a5c40"/>
    </linearGradient>
    <linearGradient id="chair-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3020"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="0.5" stop-color="#f0eadc"/>
      <stop offset="1" stop-color="#c8c0b0"/>
    </linearGradient>
    <linearGradient id="chair-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4cfc4"/>
      <stop offset="1" stop-color="#a89c80"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6a6a"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e0"/>
      <stop offset="1" stop-color="#e8e0c8"/>
    </linearGradient>
    <radialGradient id="window-rays" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#c8d8e0"/>
      <stop offset="1" stop-color="#9ab0c0"/>
    </radialGradient>
    <radialGradient id="window-bg" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#a8c4d0"/>
      <stop offset="1" stop-color="#6a8a98"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a888"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1808"/>
      <stop offset="1" stop-color="#0a0400"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.2"/>
    </filter>
    <filter id="hard-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Wall background -->
  <rect width="1200" height="1100" fill="url(#wall)"/>
  <!-- Floor -->
  <rect y="1100" width="1200" height="400" fill="url(#floor)"/>
  <line x1="0" y1="1100" x2="1200" y2="1100" stroke="#5a4830" stroke-width="1.5"/>

  <!-- Wall horizontal panel divisions -->
  <g stroke="#c8c0b0" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="280" x2="1200" y2="285"/>
    <line x1="0" y1="700" x2="1200" y2="705"/>
  </g>

  <!-- Big window with sky view (left side) -->
  <g filter="url(#soft-shadow)">
    <rect x="60" y="120" width="380" height="500" fill="url(#window-bg)" rx="6"/>
    <rect x="60" y="120" width="380" height="500" fill="url(#window-rays)" rx="6"/>
    <!-- Sky / trees gradient -->
    <rect x="60" y="120" width="380" height="180" fill="url(#sky)" opacity="0.6" rx="6"/>
    <!-- Window mullions -->
    <line x1="250" y1="120" x2="250" y2="620" stroke="#c9a84c" stroke-width="3"/>
    <line x1="60" y1="370" x2="440" y2="370" stroke="#c9a84c" stroke-width="3"/>
    <!-- Window frame -->
    <rect x="60" y="120" width="380" height="500" fill="none" stroke="#5a4830" stroke-width="6" rx="6"/>
    <!-- Subtle trees outside -->
    <ellipse cx="180" cy="380" rx="40" ry="60" fill="#6a8a60" opacity="0.4"/>
    <ellipse cx="350" cy="400" rx="50" ry="80" fill="#7a9a70" opacity="0.4"/>
  </g>

  <!-- Soft window light cast on floor -->
  <g opacity="0.15">
    <polygon points="60,620 440,620 540,1100 0,1100" fill="#fff8e0"/>
  </g>

  <!-- Framed artwork on right wall (above chair) -->
  <g transform="translate(820 120)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="280" height="360" fill="url(#accent-light)" rx="4"/>
    <rect x="6" y="6" width="268" height="348" fill="#0a3a3a" rx="3"/>
    <!-- Painting composition: abstract dental art -->
    <g transform="translate(140 180)">
      <circle cx="0" cy="-40" r="60" fill="#c9a84c" opacity="0.3"/>
      <circle cx="0" cy="-40" r="40" fill="#c9a84c" opacity="0.5"/>
      <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="120" fill="#c9a84c" font-style="italic" opacity="0.8">D</text>
    </g>
    <!-- Frame trim -->
    <rect x="0" y="0" width="280" height="360" fill="none" stroke="url(#gold)" stroke-width="4" rx="4"/>
    <!-- Light reflection on glass -->
    <path d="M 0 0 L 100 0 L 60 80 L 0 60 Z" fill="white" opacity="0.15"/>
  </g>

  <!-- Tall plant in left corner -->
  <g transform="translate(150 800)">
    <!-- Pot -->
    <path d="M -70 0 L -55 200 L 55 200 L 70 0 Z" fill="#8a7c5c"/>
    <ellipse cx="0" cy="0" rx="70" ry="8" fill="#5a4830"/>
    <ellipse cx="0" cy="200" rx="55" ry="6" fill="#3a3020"/>
    <!-- Leaves -->
    <ellipse cx="-30" cy="-50" rx="50" ry="18" fill="#4a6850" transform="rotate(-30 -30 -50)"/>
    <ellipse cx="25" cy="-80" rx="55" ry="20" fill="#3a5840" transform="rotate(20 25 -80)"/>
    <ellipse cx="0" cy="-130" rx="50" ry="18" fill="#506850" transform="rotate(-10 0 -130)"/>
    <ellipse cx="-25" cy="-180" rx="45" ry="16" fill="#4a6850" transform="rotate(-40 -25 -180)"/>
    <ellipse cx="20" cy="-200" rx="40" ry="14" fill="#3a5840" transform="rotate(15 20 -200)"/>
    <ellipse cx="-5" cy="-240" rx="35" ry="12" fill="#506850" transform="rotate(-5 -5 -240)"/>
    <ellipse cx="0" cy="-280" rx="30" ry="10" fill="#4a6850"/>
    <!-- Leaf highlights -->
    <ellipse cx="-30" cy="-65" rx="25" ry="4" fill="#5a7858" opacity="0.6" transform="rotate(-30 -30 -65)"/>
    <ellipse cx="25" cy="-95" rx="30" ry="4" fill="#5a7858" opacity="0.6" transform="rotate(20 25 -95)"/>
  </g>

  <!-- Dental chair (centerpiece) -->
  <g transform="translate(620 550)" filter="url(#hard-shadow)">
    <!-- Floor shadow -->
    <ellipse cx="0" cy="540" rx="220" ry="20" fill="#000" opacity="0.25"/>
    <!-- Hydraulic base column -->
    <rect x="-50" y="340" width="100" height="200" fill="url(#chair-base)" rx="8"/>
    <ellipse cx="0" cy="540" rx="100" ry="14" fill="#0a0400"/>
    <ellipse cx="0" cy="350" rx="60" ry="8" fill="#5a4830"/>
    <!-- Chair back -->
    <path d="M -180 340
             C -200 240, -180 80, -90 40
             L 120 40
             C 200 60, 220 240, 200 340
             Z" fill="url(#chair)"/>
    <!-- Chair back shadow side -->
    <path d="M 0 40 C 60 60, 110 80, 140 200 L 200 340 L 0 340 Z" fill="url(#chair-shadow)" opacity="0.3"/>
    <!-- Headrest -->
    <ellipse cx="0" cy="0" rx="100" ry="55" fill="url(#chair)"/>
    <ellipse cx="0" cy="0" rx="84" ry="40" fill="#f5f1ea"/>
    <ellipse cx="-20" cy="-5" rx="60" ry="28" fill="#fff" opacity="0.6"/>
    <!-- Accent stripe (teal) -->
    <rect x="-180" y="220" width="380" height="8" fill="url(#accent)"/>
    <!-- Accent gold trim -->
    <rect x="-180" y="232" width="380" height="2" fill="url(#gold)"/>
    <!-- Armrests -->
    <rect x="-220" y="240" width="50" height="170" fill="#d4cfc4" rx="8"/>
    <rect x="170" y="240" width="50" height="170" fill="#d4cfc4" rx="8"/>
    <rect x="-220" y="240" width="50" height="6" fill="url(#accent)" opacity="0.7"/>
    <rect x="170" y="240" width="50" height="6" fill="url(#accent)" opacity="0.7"/>
    <!-- Seat cushion -->
    <ellipse cx="0" cy="350" rx="160" ry="20" fill="#d4cfc4" opacity="0.5"/>
    <!-- Brand monogram on chair -->
    <text x="0" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#0f4c4c" font-style="italic" opacity="0.7">Dra. GP</text>
  </g>

  <!-- Overhead surgical lamp (above chair) -->
  <g transform="translate(620 80)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#5a4830" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#8a7c5c" stroke-width="3"/>
    <!-- Arm -->
    <line x1="0" y1="180" x2="80" y2="260" stroke="#5a4830" stroke-width="6"/>
    <line x1="80" y1="260" x2="0" y2="320" stroke="#5a4830" stroke-width="6"/>
    <!-- Lamp head -->
    <ellipse cx="0" cy="320" rx="80" ry="30" fill="url(#accent)"/>
    <ellipse cx="0" cy="320" rx="70" ry="24" fill="#0f4c4c"/>
    <!-- Light cone -->
    <ellipse cx="0" cy="350" rx="120" ry="40" fill="url(#lamp)"/>
    <ellipse cx="0" cy="420" rx="200" ry="60" fill="url(#lamp)" opacity="0.5"/>
  </g>

  <!-- Side cabinet (right) -->
  <g transform="translate(960 720)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="180" height="380" fill="url(#chair)" rx="4"/>
    <rect x="0" y="0" width="180" height="8" fill="url(#accent)"/>
    <rect x="0" y="0" width="180" height="2" fill="url(#gold)"/>
    <!-- Cabinet divisions -->
    <line x1="0" y1="100" x2="180" y2="100" stroke="#a89c80" stroke-width="1"/>
    <line x1="0" y1="220" x2="180" y2="220" stroke="#a89c80" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="380" stroke="#a89c80" stroke-width="1"/>
    <!-- Cabinet handles -->
    <circle cx="60" cy="50" r="3" fill="url(#gold)"/>
    <circle cx="120" cy="50" r="3" fill="url(#gold)"/>
    <circle cx="60" cy="160" r="3" fill="url(#gold)"/>
    <circle cx="120" cy="160" r="3" fill="url(#gold)"/>
    <circle cx="60" cy="280" r="3" fill="url(#gold)"/>
    <circle cx="120" cy="280" r="3" fill="url(#gold)"/>
    <!-- Glass reflection -->
    <path d="M 0 0 L 60 0 L 30 80 L 0 50 Z" fill="white" opacity="0.2"/>
  </g>

  <!-- Brass brand plate on cabinet -->
  <g transform="translate(960 1100)">
    <rect x="0" y="0" width="180" height="50" fill="url(#accent)" rx="2"/>
    <rect x="0" y="0" width="180" height="3" fill="url(#gold)"/>
    <text x="90" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c9a84c" letter-spacing="3" font-style="italic">DRA · GABRIELLA</text>
    <text x="90" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#c9a84c" letter-spacing="2" opacity="0.7">CONSULTORIO ODONTOLÓGICO</text>
  </g>

  <!-- Small instrument tray on cabinet top -->
  <g transform="translate(990 700)">
    <rect x="0" y="0" width="120" height="20" fill="#a89c80" rx="2"/>
    <ellipse cx="60" cy="10" rx="55" ry="6" fill="#8a7c5c" opacity="0.5"/>
    <!-- Mirrors and probes -->
    <line x1="20" y1="-30" x2="20" y2="0" stroke="#a89c80" stroke-width="2"/>
    <circle cx="20" cy="-32" r="6" fill="#cdd2cf" stroke="#5a4830" stroke-width="1"/>
    <line x1="60" y1="-25" x2="60" y2="0" stroke="#a89c80" stroke-width="2"/>
    <circle cx="60" cy="-27" r="5" fill="#cdd2cf" stroke="#5a4830" stroke-width="1"/>
    <line x1="100" y1="-30" x2="100" y2="0" stroke="#a89c80" stroke-width="2"/>
    <circle cx="100" cy="-32" r="6" fill="#cdd2cf" stroke="#5a4830" stroke-width="1"/>
  </g>

  <!-- Atmospheric particles (dust in light) -->
  <g fill="#c9a84c" opacity="0.2">
    <circle cx="380" cy="350" r="1"/>
    <circle cx="450" cy="280" r="1.5"/>
    <circle cx="520" cy="400" r="1"/>
    <circle cx="800" cy="320" r="1.5"/>
    <circle cx="900" cy="450" r="1"/>
    <circle cx="450" cy="600" r="1"/>
    <circle cx="800" cy="650" r="1.5"/>
  </g>

  <!-- Subtle floor reflection under chair -->
  <g opacity="0.15">
    <ellipse cx="620" cy="1090" rx="280" ry="14" fill="#fff"/>
  </g>
</svg>
