<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Consultation in the dental clinic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e2d6"/>
      <stop offset="1" stop-color="#b8b0a0"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#d4cfc4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c4a0"/>
      <stop offset="1" stop-color="#c8a080"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#lamp)"/>
  <!-- Cabinet on left -->
  <g filter="url(#soft-shadow)">
    <rect x="20" y="100" width="180" height="380" fill="url(#chair)" rx="4"/>
    <rect x="20" y="100" width="180" height="6" fill="url(#accent)"/>
    <line x1="110" y1="106" x2="110" y2="480" stroke="#a89c80" stroke-width="1"/>
    <circle cx="80" cy="140" r="3" fill="url(#gold)"/>
    <circle cx="140" cy="140" r="3" fill="url(#gold)"/>
    <circle cx="80" cy="280" r="3" fill="url(#gold)"/>
    <circle cx="140" cy="280" r="3" fill="url(#gold)"/>
  </g>
  <!-- Dental chair (center) -->
  <g transform="translate(280 140)" filter="url(#soft-shadow)">
    <!-- Base shadow -->
    <ellipse cx="0" cy="360" rx="160" ry="10" fill="#000" opacity="0.2"/>
    <!-- Chair back -->
    <path d="M -120 240 C -130 180, -120 80, -60 40 L 80 40 C 130 60, 140 180, 130 240 Z" fill="url(#chair)"/>
    <!-- Headrest -->
    <ellipse cx="0" cy="20" rx="70" ry="36" fill="url(#chair)"/>
    <ellipse cx="0" cy="20" rx="58" ry="26" fill="#f5f1ea"/>
    <!-- Stripe -->
    <rect x="-120" y="160" width="260" height="6" fill="url(#accent)"/>
    <!-- Patient lying on chair (head + shoulders only) -->
    <g transform="translate(0 -20)">
      <ellipse cx="0" cy="-30" rx="60" ry="50" fill="url(#skin)"/>
      <ellipse cx="0" cy="-65" rx="55" ry="40" fill="#5a4030"/>
      <!-- Closed eyes (resting) -->
      <path d="M -25 -35 Q -18 -38, -12 -35" stroke="#1a0e08" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M 12 -35 Q 18 -38, 25 -35" stroke="#1a0e08" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Bib -->
      <path d="M -50 -10 L 50 -10 L 60 60 L -60 60 Z" fill="url(#accent)"/>
      <text x="0" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#c9a84c" letter-spacing="2">DRA · GP</text>
    </g>
  </g>
  <!-- Doctor (right side, leaning over patient) -->
  <g transform="translate(560 100)" filter="url(#soft-shadow)">
    <!-- Body (white coat, leaning) -->
    <path d="M -100 60 C -100 30, -50 10, 0 10 C 50 10, 100 30, 100 60 L 120 400 L -120 400 Z" fill="#ffffff" stroke="#d4cfc4" stroke-width="1"/>
    <!-- Coat lapel -->
    <path d="M -20 80 L 0 100 L 20 80" fill="#f5f1ea"/>
    <!-- Head (looking down at patient) -->
    <ellipse cx="0" cy="-50" rx="55" ry="65" fill="url(#skin)"/>
    <!-- Hair -->
    <ellipse cx="0" cy="-90" rx="55" ry="35" fill="#3a2818"/>
    <ellipse cx="0" cy="-60" rx="55" ry="40" fill="#3a2818"/>
    <!-- Hair on forehead -->
    <path d="M -50 -90 C -45 -100, 45 -100, 50 -90" fill="#3a2818"/>
    <!-- Surgical mask -->
    <ellipse cx="0" cy="-25" rx="40" ry="35" fill="#9ec5d8" opacity="0.9"/>
    <rect x="-40" y="-50" width="80" height="3" fill="#0a3a3a"/>
    <rect x="-40" y="-25" width="80" height="3" fill="#0a3a3a"/>
    <!-- Mask straps -->
    <line x1="-40" y1="-40" x2="-65" y2="-30" stroke="#0a3a3a" stroke-width="1"/>
    <line x1="40" y1="-40" x2="65" y2="-30" stroke="#0a3a3a" stroke-width="1"/>
    <!-- Eyes (focused, looking down) -->
    <ellipse cx="-20" cy="-55" rx="4" ry="2.5" fill="#1a0e08"/>
    <ellipse cx="20" cy="-55" rx="4" ry="2.5" fill="#1a0e08"/>
    <!-- Eyebrows (concentrated) -->
    <path d="M -28 -68 Q -20 -72, -12 -68" stroke="#1a0e08" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 12 -68 Q 20 -72, 28 -68" stroke="#1a0e08" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Glasses (subtle) -->
    <circle cx="-20" cy="-55" r="14" stroke="#0a3a3a" stroke-width="1.5" fill="rgba(255,255,255,0.2)"/>
    <circle cx="20" cy="-55" r="14" stroke="#0a3a3a" stroke-width="1.5" fill="rgba(255,255,255,0.2)"/>
    <line x1="-6" y1="-55" x2="6" y2="-55" stroke="#0a3a3a" stroke-width="1.5"/>
    <!-- Surgical cap -->
    <path d="M -55 -100 C -55 -130, 55 -130, 55 -100 C 55 -85, 30 -75, 0 -75 C -30 -75, -55 -85, -55 -100 Z" fill="#9ec5d8"/>
    <path d="M -55 -100 C -55 -130, 55 -130, 55 -100" fill="none" stroke="#0a3a3a" stroke-width="1.5"/>
  </g>
  <!-- Doctor's gloved hands with tools -->
  <g transform="translate(420 320)">
    <!-- Hand 1 (mirror tool) -->
    <ellipse cx="0" cy="0" rx="20" ry="30" fill="#9ec5d8" opacity="0.85" transform="rotate(-30 0 0)"/>
    <rect x="-2" y="-10" width="4" height="80" fill="#a89c80" transform="rotate(-30 0 0)"/>
    <circle cx="-10" cy="-50" r="14" fill="#cdd2cf" stroke="#a89c80" stroke-width="2" transform="rotate(-30 0 0)"/>
    <!-- Hand 2 (probe) -->
    <ellipse cx="50" cy="-10" rx="20" ry="30" fill="#9ec5d8" opacity="0.85" transform="rotate(20 50 -10)"/>
    <rect x="48" y="0" width="3" height="80" fill="#a89c80" transform="rotate(20 50 -10)"/>
    <circle cx="80" cy="80" r="3" fill="#a89c80" transform="rotate(20 50 -10)"/>
  </g>
  <!-- Overhead lamp glow -->
  <ellipse cx="280" cy="200" rx="100" ry="40" fill="url(#lamp)"/>
  <!-- Subtle floor reflection -->
  <g opacity="0.15">
    <ellipse cx="400" cy="480" rx="280" ry="14" fill="#fff"/>
  </g>
  <!-- Caption -->
  <text x="400" y="490" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#0a3a3a" letter-spacing="3" opacity="0.5">CONSULTA · DRA · GABRIELLA</text>
</svg>
