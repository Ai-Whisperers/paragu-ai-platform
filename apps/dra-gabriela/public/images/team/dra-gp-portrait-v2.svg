<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Dra. Gabriella — professional portrait at the clinic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadc"/>
      <stop offset="1" stop-color="#c8c0b0"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.7" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c4a0"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1808"/>
      <stop offset="1" stop-color="#0a0400"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background: warm clinic interior -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#warm)"/>

  <!-- Wall (upper) -->
  <rect width="800" height="600" fill="#e8e2d6"/>
  <rect width="800" height="600" fill="url(#warm)"/>

  <!-- Floor (lower) -->
  <rect y="600" width="800" height="400" fill="#a89c80"/>
  <line x1="0" y1="600" x2="800" y2="600" stroke="#5a4830" stroke-width="1.5"/>

  <!-- Window in background (behind doctor) -->
  <g opacity="0.5">
    <rect x="500" y="100" width="200" height="280" fill="#c8d8e0" rx="4"/>
    <line x1="600" y1="100" x2="600" y2="380" stroke="#a89c80" stroke-width="2"/>
    <line x1="500" y1="240" x2="700" y2="240" stroke="#a89c80" stroke-width="2"/>
  </g>

  <!-- Doctor's body (white coat) -->
  <g filter="url(#soft-shadow)">
    <!-- Neck -->
    <ellipse cx="400" cy="560" rx="60" ry="40" fill="url(#skin)"/>
    <!-- Shoulders/Coat -->
    <path d="M 180 720
             C 180 680, 240 640, 400 640
             C 560 640, 620 680, 620 720
             L 660 1000
             L 140 1000
             Z" fill="url(#coat)"/>
    <!-- Coat lapel V -->
    <path d="M 400 640 L 350 800 L 400 740 L 450 800 Z" fill="#e6e0d4"/>
    <!-- Inner shirt -->
    <path d="M 350 800 L 400 740 L 450 800 L 440 870 L 360 870 Z" fill="#f5f1ea"/>
    <!-- Stethoscope around neck -->
    <path d="M 370 660 Q 340 760, 380 870" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 430 660 Q 460 760, 420 870" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="400" cy="900" r="16" fill="url(#accent)"/>
    <circle cx="400" cy="900" r="16" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <ellipse cx="395" cy="895" rx="5" ry="3" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Doctor's head and face -->
  <g filter="url(#soft-shadow)">
    <!-- Hair (back) -->
    <ellipse cx="400" cy="360" rx="160" ry="180" fill="url(#hair)"/>
    <!-- Face -->
    <ellipse cx="400" cy="380" rx="140" ry="175" fill="url(#skin)"/>
    <!-- Cheek warmth -->
    <ellipse cx="335" cy="430" rx="22" ry="16" fill="#e8a890" opacity="0.4"/>
    <ellipse cx="465" cy="430" rx="22" ry="16" fill="#e8a890" opacity="0.4"/>
    <!-- Eyes -->
    <ellipse cx="350" cy="370" rx="9" ry="5" fill="#1a0e08"/>
    <ellipse cx="450" cy="370" rx="9" ry="5" fill="#1a0e08"/>
    <!-- Eye highlights -->
    <circle cx="353" cy="368" r="2.5" fill="#fff"/>
    <circle cx="453" cy="368" r="2.5" fill="#fff"/>
    <!-- Subtle eyelashes -->
    <path d="M 340 360 Q 350 358, 360 360" stroke="#1a0e08" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 440 360 Q 450 358, 460 360" stroke="#1a0e08" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Eyebrows -->
    <path d="M 330 350 Q 350 345, 370 350" stroke="#1a0e08" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 430 350 Q 450 345, 470 350" stroke="#1a0e08" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Nose (subtle) -->
    <path d="M 400 410 Q 393 460, 400 480 Q 412 480, 410 472" stroke="#a88060" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Mouth (subtle professional smile) -->
    <path d="M 372 510 Q 400 525, 428 510" stroke="#8a4a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 372 510 Q 400 520, 428 510" fill="#c97070" opacity="0.3"/>
    <!-- Hair (front, parted) -->
    <path d="M 260 320
             C 270 220, 360 200, 400 200
             C 440 200, 530 220, 540 320
             C 540 340, 520 360, 490 360
             C 470 320, 430 300, 400 300
             C 370 300, 330 320, 310 360
             C 280 360, 260 340, 260 320 Z" fill="url(#hair)"/>
    <!-- Hair highlight -->
    <path d="M 310 240 Q 360 220, 400 220" stroke="#5a4030" stroke-width="3" fill="none" opacity="0.5"/>
    <!-- Subtle ear -->
    <ellipse cx="252" cy="400" rx="10" ry="20" fill="url(#skin)"/>
    <ellipse cx="252" cy="405" rx="4" ry="10" fill="#a88060" opacity="0.4"/>
  </g>

  <!-- Name plate on coat -->
  <g transform="translate(280 950)">
    <rect x="0" y="0" width="240" height="50" fill="url(#accent)" rx="4" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="240" height="3" fill="url(#gold)"/>
    <text x="120" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="url(#gold)" font-style="italic">Dra. Gabriella González Pane</text>
    <text x="120" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="url(#gold)" letter-spacing="2" opacity="0.7">CIRUJANA DENTISTA · UAP 2005</text>
  </g>

  <!-- Atmosphere -->
  <g fill="#c9a84c" opacity="0.15">
    <circle cx="100" cy="200" r="1.5"/>
    <circle cx="700" cy="300" r="1"/>
    <circle cx="200" cy="500" r="1.5"/>
  </g>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.15"/>
  </radialGradient>
  <rect width="800" height="1000" fill="url(#vignette)"/>
</svg>
