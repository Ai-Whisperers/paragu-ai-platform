<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Dra. Gabriella — at work in the clinic">
  <defs>
    <linearGradient id="bg-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e2d6"/>
      <stop offset="1" stop-color="#c8c0b0"/>
    </linearGradient>
    <radialGradient id="warm-light" cx="0.7" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <linearGradient id="coat-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4cfc4"/>
      <stop offset="1" stop-color="#a89c80"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c4a0"/>
      <stop offset="1" stop-color="#c8a080"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background: warm clinic interior -->
  <rect width="800" height="1000" fill="url(#bg-room)"/>
  <rect width="800" height="1000" fill="url(#warm-light)"/>
  <!-- Wall texture -->
  <g stroke="#d4cfc4" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="200" x2="800" y2="205"/>
    <line x1="0" y1="500" x2="800" y2="505"/>
  </g>
  <!-- Window top-right -->
  <g filter="url(#soft-shadow)">
    <rect x="500" y="50" width="240" height="280" fill="#fff8e0" rx="4"/>
    <rect x="500" y="50" width="240" height="280" fill="none" stroke="#c9a84c" stroke-width="3" rx="4"/>
    <line x1="620" y1="50" x2="620" y2="330" stroke="#c9a84c" stroke-width="2"/>
    <line x1="500" y1="190" x2="740" y2="190" stroke="#c9a84c" stroke-width="2"/>
    <!-- Soft glow from window -->
    <ellipse cx="620" cy="200" rx="200" ry="150" fill="#fff8e0" opacity="0.4"/>
  </g>
  <!-- Framed picture top-left -->
  <g transform="translate(60 100)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="160" height="200" fill="url(#accent)" rx="4"/>
    <rect x="6" y="6" width="148" height="188" fill="#0a3a3a" rx="3"/>
    <text x="80" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="80" fill="#c9a84c" font-style="italic" opacity="0.7">D</text>
    <rect x="0" y="0" width="160" height="200" fill="none" stroke="#c9a84c" stroke-width="3" rx="4"/>
  </g>
  <!-- Doctor body (white coat) -->
  <g filter="url(#soft-shadow)">
    <!-- Neck -->
    <ellipse cx="400" cy="580" rx="50" ry="40" fill="url(#skin)"/>
    <!-- Body / coat -->
    <path d="M 220 700
             C 220 660, 280 640, 400 640
             C 520 640, 580 660, 580 700
             L 600 1000
             L 200 1000
             Z" fill="url(#coat)"/>
    <!-- Coat shadow on right side -->
    <path d="M 400 640 C 460 645, 510 660, 540 690 L 580 1000 L 400 1000 Z" fill="url(#coat-shadow)" opacity="0.4"/>
    <!-- Lapel V -->
    <path d="M 400 640 L 360 760 L 400 720 L 440 760 Z" fill="url(#coat-shadow)"/>
    <!-- Inner shirt -->
    <path d="M 360 760 L 400 720 L 440 760 L 430 800 L 370 800 Z" fill="#f5f1ea"/>
    <!-- Stethoscope around neck -->
    <path d="M 380 660 Q 360 720, 380 800" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 420 660 Q 440 720, 420 800" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="400" cy="820" r="14" fill="url(#accent)"/>
    <circle cx="400" cy="820" r="14" fill="none" stroke="#c9a84c" stroke-width="1"/>
  </g>
  <!-- Head and face -->
  <g filter="url(#soft-shadow)">
    <!-- Hair (back) -->
    <ellipse cx="400" cy="370" rx="155" ry="180" fill="url(#hair)"/>
    <!-- Face -->
    <ellipse cx="400" cy="380" rx="135" ry="170" fill="url(#skin)"/>
    <!-- Cheek warmth -->
    <ellipse cx="340" cy="420" rx="20" ry="15" fill="#e8a890" opacity="0.4"/>
    <ellipse cx="460" cy="420" rx="20" ry="15" fill="#e8a890" opacity="0.4"/>
    <!-- Eyes (warm, professional) -->
    <ellipse cx="350" cy="370" rx="9" ry="5" fill="#1a0e08"/>
    <ellipse cx="450" cy="370" rx="9" ry="5" fill="#1a0e08"/>
    <!-- Eye highlights (life) -->
    <circle cx="353" cy="368" r="2" fill="#fff"/>
    <circle cx="453" cy="368" r="2" fill="#fff"/>
    <!-- Eyebrows -->
    <path d="M 335 350 Q 350 345, 365 350" stroke="#1a0e08" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 435 350 Q 450 345, 465 350" stroke="#1a0e08" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Nose (subtle) -->
    <path d="M 400 400 Q 395 440, 400 460 Q 408 460, 408 455" stroke="#a88060" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Mouth (subtle professional smile) -->
    <path d="M 372 500 Q 400 515, 428 500" stroke="#8a4a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 372 500 Q 400 510, 428 500" fill="#c97070" opacity="0.4"/>
    <!-- Hair (front, parted to side) -->
    <path d="M 270 320
             C 280 230, 360 200, 400 200
             C 440 200, 520 230, 530 320
             C 530 340, 510 360, 480 360
             C 460 320, 420 300, 400 300
             C 380 300, 340 320, 320 360
             C 290 360, 270 340, 270 320 Z" fill="url(#hair)"/>
    <!-- Hair highlight -->
    <path d="M 320 240 Q 360 220, 400 220" stroke="#5a4030" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  <!-- Name plate on coat (golden, professional) -->
  <g transform="translate(280 900)">
    <rect x="0" y="0" width="240" height="50" fill="url(#accent)" rx="4" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="240" height="3" fill="url(#gold)"/>
    <text x="120" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c9a84c" font-style="italic">Dra. Gabriella González Pane</text>
    <text x="120" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#c9a84c" letter-spacing="2" opacity="0.7">CIRUJANA DENTISTA · UAP 2005</text>
  </g>
  <!-- Subtle vignette at bottom -->
  <rect y="900" width="800" height="100" fill="url(#bg-room)" opacity="0.6"/>
</svg>
