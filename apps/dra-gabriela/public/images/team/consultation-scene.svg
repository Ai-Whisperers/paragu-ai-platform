<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Dra. Gabriella with a patient during a consultation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadc"/>
      <stop offset="1" stop-color="#a89c80"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#c8c0b0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c4c"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c4a0"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a888"/>
      <stop offset="1" stop-color="#9a6c4c"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ec5d8"/>
      <stop offset="1" stop-color="#6a9aae"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#fff8e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#lamp)"/>

  <!-- Wall behind -->
  <rect width="1200" height="900" fill="#e8e2d6"/>
  <rect width="1200" height="900" fill="url(#lamp)"/>

  <!-- Cabinet on left -->
  <g filter="url(#soft-shadow)">
    <rect x="0" y="200" width="280" height="700" fill="url(#chair)" rx="4"/>
    <rect x="0" y="200" width="280" height="8" fill="url(#accent)"/>
    <line x1="0" y1="380" x2="280" y2="380" stroke="#a89c80" stroke-width="1"/>
    <line x1="0" y1="600" x2="280" y2="600" stroke="#a89c80" stroke-width="1"/>
    <line x1="140" y1="200" x2="140" y2="900" stroke="#a89c80" stroke-width="1"/>
    <!-- Handles -->
    <circle cx="100" cy="290" r="4" fill="url(#gold)"/>
    <circle cx="180" cy="290" r="4" fill="url(#gold)"/>
    <circle cx="100" cy="490" r="4" fill="url(#gold)"/>
    <circle cx="180" cy="490" r="4" fill="url(#gold)"/>
    <circle cx="100" cy="700" r="4" fill="url(#gold)"/>
    <circle cx="180" cy="700" r="4" fill="url(#gold)"/>
  </g>

  <!-- Patient on chair (center, foreground) -->
  <g transform="translate(360 600)" filter="url(#soft-shadow)">
    <!-- Floor shadow -->
    <ellipse cx="100" cy="850" rx="280" ry="20" fill="#000" opacity="0.2"/>
    <!-- Chair base -->
    <rect x="50" y="650" width="120" height="200" fill="#3a3020" rx="8"/>
    <ellipse cx="110" cy="850" rx="100" ry="14" fill="#1a1208"/>
    <!-- Chair seat -->
    <path d="M -50 600 L 280 600 L 320 670 L -90 670 Z" fill="url(#chair)"/>
    <!-- Chair back -->
    <path d="M -40 600
             C -60 480, -30 240, 60 220
             L 220 220
             C 280 240, 290 480, 280 600
             Z" fill="url(#chair)"/>
    <!-- Headrest -->
    <ellipse cx="120" cy="170" rx="110" ry="60" fill="url(#chair)"/>
    <ellipse cx="120" cy="170" rx="92" ry="44" fill="#f5f1ea"/>
    <!-- Accent stripe -->
    <rect x="-40" y="450" width="320" height="8" fill="url(#accent)"/>
    <!-- Patient body (lying down) -->
    <!-- Head tilted back -->
    <ellipse cx="120" cy="140" rx="80" ry="65" fill="url(#skin2)"/>
    <!-- Hair (back) -->
    <ellipse cx="120" cy="100" rx="80" ry="50" fill="#3a2818"/>
    <path d="M 60 100 Q 120 50, 180 100" fill="#3a2818"/>
    <!-- Eyes closed (resting) -->
    <path d="M 80 140 Q 90 138, 100 140" stroke="#1a0e08" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 140 140 Q 150 138, 160 140" stroke="#1a0e08" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Mouth (slight smile) -->
    <path d="M 110 175 Q 120 178, 130 175" stroke="#8a4a4a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Body covered with bib -->
    <path d="M -50 220 L 280 220 L 350 700 L -100 700 Z" fill="url(#accent)"/>
    <!-- Bib detail -->
    <rect x="-50" y="220" width="330" height="6" fill="url(#gold)"/>
    <text x="100" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#c9a84c" letter-spacing="2" font-weight="700">DRA · GP</text>
    <!-- Bib clip -->
    <circle cx="-20" cy="240" r="4" fill="url(#gold)"/>
    <circle cx="240" cy="240" r="4" fill="url(#gold)"/>
  </g>

  <!-- Doctor on right side, leaning over patient -->
  <g transform="translate(820 200)" filter="url(#soft-shadow)">
    <!-- Body (white coat, leaning forward) -->
    <path d="M -120 250
             C -120 200, -60 180, 0 180
             C 60 180, 120 200, 120 250
             L 140 800
             L -140 800 Z" fill="url(#coat)"/>
    <!-- Coat shadow on right -->
    <path d="M 0 180 C 60 200, 100 240, 120 350 L 140 800 L 0 800 Z" fill="#d4cfc4" opacity="0.4"/>
    <!-- Coat lapel -->
    <path d="M -30 280 L 0 320 L 30 280" fill="#f5f1ea"/>
    <!-- Inner shirt -->
    <path d="M -10 280 L 0 350 L 10 280 Z" fill="#e6e0d4"/>
    <!-- Stethoscope around neck -->
    <path d="M -45 240 Q -65 350, -30 480" stroke="url(#accent)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 45 240 Q 65 350, 30 480" stroke="url(#accent)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="510" rx="22" ry="18" fill="url(#accent)"/>
    <ellipse cx="0" cy="510" rx="22" ry="18" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <ellipse cx="-6" cy="505" rx="6" ry="3" fill="#fff" opacity="0.5"/>
    <!-- Head and face (leaning forward, looking down) -->
    <ellipse cx="0" cy="80" rx="80" ry="100" fill="url(#skin)"/>
    <!-- Surgical cap -->
    <path d="M -85 80
             C -85 0, 85 0, 85 80
             C 85 100, 60 110, 0 110
             C -60 110, -85 100, -85 80 Z" fill="url(#mask)"/>
    <path d="M -85 80
             C -85 0, 85 0, 85 80" fill="none" stroke="#0a3a3a" stroke-width="2"/>
    <!-- Cap pattern (small marks) -->
    <circle cx="-50" cy="40" r="3" fill="#fff" opacity="0.4"/>
    <circle cx="0" cy="30" r="3" fill="#fff" opacity="0.4"/>
    <circle cx="50" cy="40" r="3" fill="#fff" opacity="0.4"/>
    <!-- Hair (forehead under cap) -->
    <ellipse cx="0" cy="80" rx="60" ry="10" fill="#1a0e08"/>
    <!-- Surgical mask -->
    <path d="M -55 110 L -45 220 L 45 220 L 55 110 Q 60 95, 0 95 Q -60 95, -55 110 Z" fill="url(#mask)"/>
    <!-- Mask straps -->
    <line x1="-55" y1="130" x2="-90" y2="140" stroke="#0a3a3a" stroke-width="2"/>
    <line x1="55" y1="130" x2="90" y2="140" stroke="#0a3a3a" stroke-width="2"/>
    <line x1="-55" y1="170" x2="-90" y2="160" stroke="#0a3a3a" stroke-width="2"/>
    <line x1="55" y1="170" x2="90" y2="160" stroke="#0a3a3a" stroke-width="2"/>
    <!-- Mask shadow under nose -->
    <path d="M -10 200 Q 0 215, 10 200" stroke="#0a3a3a" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Glasses (loupes) -->
    <circle cx="-30" cy="140" r="22" fill="rgba(255,255,255,0.3)" stroke="#0a3a3a" stroke-width="2.5"/>
    <circle cx="30" cy="140" r="22" fill="rgba(255,255,255,0.3)" stroke="#0a3a3a" stroke-width="2.5"/>
    <line x1="-8" y1="140" x2="8" y2="140" stroke="#0a3a3a" stroke-width="2.5"/>
    <!-- Eyes through glasses (looking down) -->
    <ellipse cx="-30" cy="140" rx="3" ry="2" fill="#1a0e08"/>
    <ellipse cx="30" cy="140" rx="3" ry="2" fill="#1a0e08"/>
    <!-- Eyebrows above glasses -->
    <path d="M -45 110 Q -30 105, -15 110" stroke="#1a0e08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 15 110 Q 30 105, 45 110" stroke="#1a0e08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Doctor's gloved hands with dental tools -->
  <g transform="translate(560 750)">
    <!-- Left hand with mirror -->
    <ellipse cx="0" cy="0" rx="28" ry="40" fill="#9ec5d8" opacity="0.9" transform="rotate(-30 0 0)"/>
    <rect x="-3" y="-15" width="6" height="100" fill="#a89c80" transform="rotate(-30 0 0)"/>
    <circle cx="-15" cy="-60" r="20" fill="#cdd2cf" stroke="#a89c80" stroke-width="2" transform="rotate(-30 0 0)"/>
    <ellipse cx="-20" cy="-65" rx="6" ry="3" fill="#fff" opacity="0.6" transform="rotate(-30 0 0)"/>
    <!-- Right hand with probe -->
    <ellipse cx="80" cy="-15" rx="28" ry="40" fill="#9ec5d8" opacity="0.9" transform="rotate(20 80 -15)"/>
    <rect x="78" y="0" width="5" height="100" fill="#a89c80" transform="rotate(20 80 -15)"/>
    <circle cx="120" cy="100" r="4" fill="#a89c80" transform="rotate(20 80 -15)"/>
  </g>

  <!-- Overhead lamp glow on patient -->
  <ellipse cx="480" cy="400" rx="160" ry="50" fill="url(#lamp)"/>
  <ellipse cx="480" cy="500" rx="240" ry="70" fill="url(#lamp)" opacity="0.5"/>

  <!-- Atmosphere -->
  <g fill="#c9a84c" opacity="0.2">
    <circle cx="200" cy="300" r="1.5"/>
    <circle cx="300" cy="450" r="1"/>
    <circle cx="1000" cy="350" r="1.5"/>
    <circle cx="1100" cy="550" r="1"/>
  </g>

  <!-- Floor reflection -->
  <g opacity="0.15">
    <ellipse cx="600" cy="1450" rx="400" ry="20" fill="#fff"/>
  </g>

  <!-- Caption -->
  <text x="600" y="1480" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#0a3a3a" letter-spacing="4" opacity="0.5">CONSULTA · DRA · GABRIELLA</text>
</svg>
