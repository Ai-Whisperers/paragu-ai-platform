<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Cosmetic dentistry smile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c97070"/>
      <stop offset="1" stop-color="#8a4848"/>
    </linearGradient>
    <linearGradient id="lip-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a05858"/>
      <stop offset="1" stop-color="#6a3030"/>
    </linearGradient>
    <linearGradient id="tooth-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="tooth-veneer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#spot)"/>
  <!-- Smile (closed mouth with parted lips showing teeth) -->
  <g transform="translate(300 200)" filter="url(#soft-shadow)">
    <!-- Upper lip -->
    <path d="M -180 -30
             C -180 -60, -140 -80, -100 -75
             C -70 -72, -40 -60, 0 -55
             C 40 -60, 70 -72, 100 -75
             C 140 -80, 180 -60, 180 -30
             C 180 0, 160 20, 130 30
             C 100 38, 60 35, 30 28
             C 0 22, -30 22, -60 28
             C -90 35, -130 38, -160 30
             C -170 20, -180 0, -180 -30 Z"
          fill="url(#lip)"/>
    <!-- Upper lip highlight -->
    <path d="M -160 -40 C -120 -55, -60 -65, 0 -62 C 60 -65, 120 -55, 160 -40"
          stroke="#e88a8a" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- Lower lip -->
    <path d="M -160 30
             C -150 60, -100 80, 0 80
             C 100 80, 150 60, 160 30
             C 150 38, 100 50, 0 50
             C -100 50, -150 38, -160 30 Z"
          fill="url(#lip-shadow)"/>
    <!-- Inner mouth (dark) -->
    <ellipse cx="0" cy="0" rx="130" ry="20" fill="#0a0a0a"/>
    <!-- Upper teeth row -->
    <g transform="translate(0 -8)">
      <g transform="translate(-120 0)">
        <rect x="-8" y="-2" width="16" height="22" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.6"/>
      </g>
      <g transform="translate(-100 0)">
        <rect x="-8" y="-2" width="16" height="22" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.6"/>
      </g>
      <g transform="translate(-78 0)">
        <rect x="-8" y="-2" width="16" height="24" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.8"/>
      </g>
      <g transform="translate(-56 0)">
        <rect x="-9" y="-2" width="18" height="24" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.8"/>
      </g>
      <g transform="translate(-32 0)">
        <rect x="-10" y="-2" width="20" height="26" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="1"/>
      </g>
      <g transform="translate(-8 0)">
        <rect x="-10" y="-2" width="20" height="26" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="1"/>
      </g>
      <g transform="translate(16 0)">
        <rect x="-10" y="-2" width="20" height="26" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="1"/>
      </g>
      <g transform="translate(40 0)">
        <rect x="-9" y="-2" width="18" height="24" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.8"/>
      </g>
      <g transform="translate(62 0)">
        <rect x="-8" y="-2" width="16" height="24" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.8"/>
      </g>
      <g transform="translate(84 0)">
        <rect x="-8" y="-2" width="16" height="22" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.6"/>
      </g>
      <g transform="translate(104 0)">
        <rect x="-8" y="-2" width="16" height="22" rx="3" fill="url(#tooth-veneer)" stroke="#c9a84c" stroke-width="0.6"/>
      </g>
    </g>
    <!-- Lower teeth (subtle, less visible) -->
    <g transform="translate(0 16)" opacity="0.7">
      <rect x="-100" y="-2" width="200" height="14" rx="6" fill="url(#tooth-white)"/>
      <line x1="-80" y1="-2" x2="-80" y2="12" stroke="#d4cfc4" stroke-width="0.5"/>
      <line x1="-50" y1="-2" x2="-50" y2="12" stroke="#d4cfc4" stroke-width="0.5"/>
      <line x1="-20" y1="-2" x2="-20" y2="12" stroke="#d4cfc4" stroke-width="0.5"/>
      <line x1="20" y1="-2" x2="20" y2="12" stroke="#d4cfc4" stroke-width="0.5"/>
      <line x1="50" y1="-2" x2="50" y2="12" stroke="#d4cfc4" stroke-width="0.5"/>
      <line x1="80" y1="-2" x2="80" y2="12" stroke="#d4cfc4" stroke-width="0.5"/>
    </g>
    <!-- Sparkle on central tooth -->
    <g transform="translate(0 -16)" fill="#fff" opacity="0.9">
      <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z"/>
    </g>
    <g transform="translate(60 -10)" fill="url(#gold)" opacity="0.7">
      <path d="M 0 -5 L 1 -1 L 5 0 L 1 1 L 0 5 L -1 1 L -5 0 L -1 -1 Z"/>
    </g>
  </g>
  <text x="300" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#0f4c4c" letter-spacing="4" opacity="0.6">ESTÉTICA DENTAL</text>
</svg>
