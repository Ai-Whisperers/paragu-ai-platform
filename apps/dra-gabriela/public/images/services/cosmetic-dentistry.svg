<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Cosmetic dentistry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <linearGradient id="smile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f5f1ea"/>
    </linearGradient>
    <linearGradient id="veneer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Smile arc -->
  <g transform="translate(300 200)">
    <path d="M -160 -40 Q -160 100, 0 130 Q 160 100, 160 -40 Z" fill="url(#smile)" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.15))"/>
    <path d="M -160 -40 Q -160 100, 0 130 Q 160 100, 160 -40" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <!-- Teeth row -->
    <g transform="translate(0 30)">
      <rect x="-130" y="-20" width="22" height="40" fill="#fbf9f6" rx="4" stroke="#d4cfc4" stroke-width="0.5"/>
      <rect x="-104" y="-22" width="22" height="42" fill="#fbf9f6" rx="4" stroke="#d4cfc4" stroke-width="0.5"/>
      <rect x="-78" y="-24" width="22" height="44" fill="url(#veneer)" rx="4" stroke="#c9a84c" stroke-width="1.2"/>
      <rect x="-52" y="-24" width="22" height="44" fill="url(#veneer)" rx="4" stroke="#c9a84c" stroke-width="1.2"/>
      <rect x="-26" y="-25" width="22" height="45" fill="url(#veneer)" rx="4" stroke="#c9a84c" stroke-width="1.2"/>
      <rect x="0" y="-25" width="22" height="45" fill="url(#veneer)" rx="4" stroke="#c9a84c" stroke-width="1.2"/>
      <rect x="26" y="-24" width="22" height="44" fill="url(#veneer)" rx="4" stroke="#c9a84c" stroke-width="1.2"/>
      <rect x="52" y="-24" width="22" height="44" fill="url(#veneer)" rx="4" stroke="#c9a84c" stroke-width="1.2"/>
      <rect x="78" y="-22" width="22" height="42" fill="#fbf9f6" rx="4" stroke="#d4cfc4" stroke-width="0.5"/>
      <rect x="104" y="-20" width="22" height="40" fill="#fbf9f6" rx="4" stroke="#d4cfc4" stroke-width="0.5"/>
    </g>
    <!-- Sparkle -->
    <g transform="translate(80 -50)" fill="#c9a84c">
      <path d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z"/>
    </g>
    <g transform="translate(-60 -30)" fill="#fff" opacity="0.9">
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z"/>
    </g>
  </g>
  <text x="300" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#0f4c4c" letter-spacing="4" font-weight="600">ESTÉTICA DENTAL</text>
</svg>
