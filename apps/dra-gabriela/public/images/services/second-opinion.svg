<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Second opinion review">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3a3a"/>
      <stop offset="1" stop-color="#0f4c4c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <!-- Two stacked documents -->
  <g transform="translate(140 90)">
    <rect x="0" y="0" width="280" height="220" fill="#ffffff" fill-opacity="0.08" rx="6"/>
    <rect x="20" y="20" width="280" height="220" fill="#ffffff" fill-opacity="0.95" rx="6" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))"/>
    <rect x="40" y="40" width="160" height="10" fill="#0f4c4c" rx="2"/>
    <rect x="40" y="60" width="220" height="3" fill="#9a8c7e"/>
    <rect x="40" y="70" width="200" height="3" fill="#9a8c7e"/>
    <rect x="40" y="80" width="220" height="3" fill="#9a8c7e"/>
    <rect x="40" y="100" width="220" height="60" fill="#e6efef" rx="4"/>
    <rect x="50" y="110" width="100" height="4" fill="#0f4c4c"/>
    <rect x="50" y="120" width="180" height="3" fill="#9a8c7e"/>
    <rect x="50" y="130" width="160" height="3" fill="#9a8c7e"/>
    <rect x="40" y="180" width="220" height="50" fill="#c9a84c" fill-opacity="0.15" rx="4" stroke="#c9a84c" stroke-width="1"/>
    <rect x="50" y="195" width="100" height="4" fill="#c9a84c"/>
    <rect x="50" y="205" width="180" height="3" fill="#0f4c4c"/>
  </g>
  <!-- Magnifying glass -->
  <g transform="translate(420 220)">
    <circle cx="0" cy="0" r="50" fill="rgba(15,76,76,0.3)" stroke="#c9a84c" stroke-width="4"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <line x1="36" y1="36" x2="68" y2="68" stroke="#c9a84c" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
