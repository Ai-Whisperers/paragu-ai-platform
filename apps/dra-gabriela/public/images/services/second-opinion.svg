<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Second opinion review">
  <defs>
    <!-- Warm light gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3a3a"/>
      <stop offset="1" stop-color="#0a2020"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.3" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#lamp)"/>
  <rect width="600" height="400" fill="url(#vignette)"/>
  <!-- Stack of papers with soft shadows -->
  <g transform="translate(110 90)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="320" height="220" fill="#fbf9f6" fill-opacity="0.08" rx="4" transform="rotate(-3 160 110)"/>
    <rect x="20" y="20" width="320" height="220" fill="#fbf9f6" fill-opacity="0.95" rx="4" transform="rotate(2 180 130)"/>
    <rect x="40" y="40" width="320" height="220" fill="url(#paper)" rx="4"/>
    <!-- Top accent line -->
    <rect x="40" y="40" width="320" height="6" fill="url(#gold)"/>
    <!-- Header line -->
    <rect x="60" y="64" width="140" height="10" fill="#0f4c4c" rx="2"/>
    <rect x="60" y="82" width="60" height="6" fill="#c9a84c" rx="1"/>
    <!-- Body lines -->
    <g transform="translate(60 110)">
      <rect x="0" y="0" width="280" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="10" width="240" height="3" fill="#9a8c7e" rx="1"/>
      <rect x="0" y="20" width="260" height="3" fill="#9a8c7e" rx="1"/>
    </g>
    <!-- Boxed section -->
    <g transform="translate(60 150)">
      <rect x="0" y="0" width="280" height="40" fill="#e6efef" rx="3"/>
      <rect x="10" y="10" width="80" height="3" fill="#0f4c4c" rx="1"/>
      <rect x="10" y="18" width="240" height="2" fill="#9a8c7e" rx="1"/>
      <rect x="10" y="24" width="200" height="2" fill="#9a8c7e" rx="1"/>
      <rect x="10" y="30" width="180" height="2" fill="#9a8c7e" rx="1"/>
    </g>
    <!-- Highlighted box -->
    <g transform="translate(60 200)">
      <rect x="0" y="0" width="280" height="40" fill="#c9a84c" fill-opacity="0.15" rx="3" stroke="#c9a84c" stroke-width="1"/>
      <rect x="10" y="10" width="100" height="3" fill="#c9a84c" rx="1"/>
      <rect x="10" y="18" width="240" height="2" fill="#0f4c4c" rx="1"/>
      <rect x="10" y="24" width="200" height="2" fill="#0f4c4c" rx="1"/>
    </g>
  </g>
  <!-- Magnifying glass with brass ring -->
  <g transform="translate(420 220)">
    <circle cx="0" cy="0" r="50" fill="rgba(15,76,76,0.2)" stroke="url(#gold)" stroke-width="6" filter="url(#soft-shadow)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="36" y1="36" x2="68" y2="68" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="68" y2="68" stroke="rgba(0,0,0,0.3)" stroke-width="2" stroke-linecap="round" transform="translate(2 2)"/>
  </g>
  <!-- Subtle brand label -->
  <text x="300" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#c9a84c" letter-spacing="4" opacity="0.7">SEGUNDA OPINIÓN</text>
</svg>
