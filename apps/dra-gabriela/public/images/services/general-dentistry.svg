<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="General dentistry care">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6a6a"/>
      <stop offset="1" stop-color="#0a3a3a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tooth-shine" cx="0.4" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tooth-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#lamp)"/>
  <!-- Atmospheric particles -->
  <g fill="#fff" opacity="0.3">
    <circle cx="80" cy="80" r="1"/>
    <circle cx="120" cy="180" r="1.5"/>
    <circle cx="500" cy="100" r="1"/>
    <circle cx="540" cy="280" r="1.5"/>
    <circle cx="60" cy="320" r="1"/>
    <circle cx="480" cy="350" r="1.5"/>
    <circle cx="160" cy="60" r="0.8"/>
    <circle cx="440" cy="200" r="0.8"/>
  </g>
  <!-- Glow behind tooth -->
  <ellipse cx="300" cy="200" rx="160" ry="130" fill="url(#gold)" opacity="0.2" filter="url(#glow)"/>
  <!-- Hero tooth -->
  <g transform="translate(300 200)">
    <!-- Shadow under tooth -->
    <ellipse cx="0" cy="100" rx="100" ry="12" fill="#000" opacity="0.3"/>
    <!-- Tooth shape (anatomically stylized) -->
    <path d="M -90 -10
             C -90 -60, -50 -90, 0 -90
             C 50 -90, 90 -60, 90 -10
             C 90 20, 75 50, 60 80
             C 50 100, 35 110, 25 100
             C 18 90, 15 60, 5 30
             C 0 18, -5 18, -10 30
             C -20 60, -25 90, -32 100
             C -42 110, -55 100, -65 80
             C -80 50, -90 20, -90 -10 Z"
          fill="url(#tooth-body)" stroke="#d4cfc4" stroke-width="1"/>
    <!-- Highlight -->
    <ellipse cx="-30" cy="-40" rx="25" ry="20" fill="url(#tooth-shine)"/>
    <!-- Inner reflection -->
    <ellipse cx="20" cy="-30" rx="6" ry="3" fill="#fff" opacity="0.6"/>
    <!-- Sparkle -->
    <g transform="translate(40 -50)" fill="url(#gold)" opacity="0.8">
      <path d="M 0 -8 L 1.5 -1.5 L 8 0 L 1.5 1.5 L 0 8 L -1.5 1.5 L -8 0 L -1.5 -1.5 Z"/>
    </g>
    <g transform="translate(0 20)" fill="#fff" opacity="0.7">
      <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z"/>
    </g>
  </g>
  <!-- Subtle caption -->
  <text x="300" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#c9a84c" letter-spacing="4" opacity="0.6">CUIDADO GENERAL</text>
</svg>
