<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="General dentistry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6a6a"/>
      <stop offset="1" stop-color="#0f4c4c"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#light)"/>
  <!-- Stylized tooth -->
  <g transform="translate(300 200)">
    <ellipse cx="0" cy="0" rx="120" ry="100" fill="#fbf9f6" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.3))"/>
    <ellipse cx="0" cy="0" rx="100" ry="84" fill="#fff"/>
    <ellipse cx="-30" cy="-20" rx="30" ry="20" fill="#f0f0f0" opacity="0.6"/>
    <!-- Sparkle on tooth -->
    <g transform="translate(60 -40)" fill="#c9a84c">
      <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z"/>
    </g>
    <g transform="translate(30 30)" fill="#c9a84c" opacity="0.7">
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z"/>
    </g>
  </g>
  <!-- Dental tools around -->
  <g transform="translate(80 80)">
    <rect x="0" y="0" width="60" height="14" fill="#c9a84c" rx="2" transform="rotate(-30 30 7)"/>
    <circle cx="0" cy="7" r="10" fill="#0a0a0a" transform="rotate(-30 30 7)"/>
  </g>
  <g transform="translate(480 320)">
    <rect x="0" y="0" width="50" height="10" fill="#fff" opacity="0.6" rx="2" transform="rotate(20 25 5)"/>
  </g>
  <!-- Caption -->
  <text x="300" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#c9a84c" letter-spacing="4" font-weight="600">CUIDADO GENERAL</text>
</svg>
