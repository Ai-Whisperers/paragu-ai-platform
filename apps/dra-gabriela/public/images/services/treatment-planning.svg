<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Treatment planning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Calendar -->
  <g transform="translate(80 80)">
    <rect x="0" y="20" width="220" height="240" fill="#ffffff" rx="8" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.1))"/>
    <rect x="0" y="20" width="220" height="50" fill="#0f4c4c" rx="8"/>
    <rect x="0" y="60" width="220" height="10" fill="#0f4c4c"/>
    <text x="110" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#c9a84c" letter-spacing="3" font-weight="600">PLAN</text>
    <!-- Calendar dots -->
    <g fill="#1c1c1c">
      <circle cx="40" cy="100" r="3"/><circle cx="80" cy="100" r="3"/><circle cx="120" cy="100" r="3"/><circle cx="160" cy="100" r="3"/><circle cx="200" cy="100" r="3"/>
      <circle cx="40" cy="130" r="3"/><circle cx="80" cy="130" r="3"/><circle cx="120" cy="130" r="3"/><circle cx="160" cy="130" r="3"/><circle cx="200" cy="130" r="3"/>
      <circle cx="40" cy="160" r="3"/><circle cx="80" cy="160" r="3"/><circle cx="120" cy="160" r="3"/><circle cx="160" cy="160" r="3"/><circle cx="200" cy="160" r="3"/>
      <circle cx="40" cy="190" r="3"/><circle cx="80" cy="190" r="3"/><circle cx="120" cy="190" r="3"/><circle cx="160" cy="190" r="3"/><circle cx="200" cy="190" r="3"/>
      <circle cx="40" cy="220" r="3"/><circle cx="80" cy="220" r="3"/><circle cx="120" cy="220" r="3"/><circle cx="160" cy="220" r="3"/><circle cx="200" cy="220" r="3"/>
    </g>
    <!-- Highlighted dates -->
    <circle cx="80" cy="130" r="10" fill="#c9a84c"/>
    <circle cx="120" cy="190" r="10" fill="#0f4c4c"/>
    <circle cx="160" cy="160" r="10" fill="#c9a84c"/>
  </g>
  <!-- Document with checkmarks -->
  <g transform="translate(320 100)">
    <rect x="0" y="0" width="200" height="240" fill="#ffffff" rx="6" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.1))"/>
    <rect x="20" y="20" width="100" height="8" fill="#0f4c4c" rx="2"/>
    <g transform="translate(20 50)" font-family="Inter, sans-serif" font-size="11" fill="#1c1c1c">
      <circle cx="8" cy="8" r="7" fill="#0f4c4c"/>
      <text x="14" y="12" fill="#fff" font-size="9" font-weight="700">✓</text>
      <rect x="24" y="4" width="120" height="3" fill="#9a8c7e"/>
      <rect x="24" y="10" width="80" height="3" fill="#c9a84c"/>

      <circle cx="8" cy="38" r="7" fill="#0f4c4c"/>
      <text x="14" y="42" fill="#fff" font-size="9" font-weight="700">✓</text>
      <rect x="24" y="34" width="140" height="3" fill="#9a8c7e"/>
      <rect x="24" y="40" width="100" height="3" fill="#c9a84c"/>

      <circle cx="8" cy="68" r="7" fill="#0f4c4c"/>
      <text x="14" y="72" fill="#fff" font-size="9" font-weight="700">✓</text>
      <rect x="24" y="64" width="100" height="3" fill="#9a8c7e"/>
      <rect x="24" y="70" width="120" height="3" fill="#c9a84c"/>

      <circle cx="8" cy="98" r="7" fill="#fff" stroke="#0f4c4c" stroke-width="1.5"/>
      <rect x="24" y="94" width="110" height="3" fill="#9a8c7e"/>

      <circle cx="8" cy="128" r="7" fill="#fff" stroke="#0f4c4c" stroke-width="1.5"/>
      <rect x="24" y="124" width="130" height="3" fill="#9a8c7e"/>
    </g>
  </g>
  <!-- Decorative line -->
  <line x1="60" y1="350" x2="540" y2="350" stroke="#c9a84c" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
