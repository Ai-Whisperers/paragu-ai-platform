<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Treatment planning calendar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f1ea"/>
      <stop offset="1" stop-color="#e6dccc"/>
    </linearGradient>
    <linearGradient id="cal-header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6a6a"/>
      <stop offset="1" stop-color="#0f4c4c"/>
    </linearGradient>
    <linearGradient id="cal-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f1ea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#spot)"/>
  <!-- Calendar (large) -->
  <g transform="translate(60 80)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="260" height="280" fill="url(#cal-paper)" rx="8"/>
    <rect x="0" y="0" width="260" height="60" fill="url(#cal-header)" rx="8"/>
    <rect x="0" y="50" width="260" height="10" fill="url(#cal-header)"/>
    <text x="130" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#c9a84c" letter-spacing="4" font-weight="700">PLAN</text>
    <!-- Hanging tabs (calendar rings) -->
    <rect x="40" y="-10" width="6" height="20" fill="#5a5040" rx="2"/>
    <rect x="214" y="-10" width="6" height="20" fill="#5a5040" rx="2"/>
    <!-- Day labels -->
    <g font-family="Inter, sans-serif" font-size="9" fill="#9a8c7e" text-anchor="middle">
      <text x="32" y="84">L</text>
      <text x="68" y="84">M</text>
      <text x="104" y="84">M</text>
      <text x="140" y="84">J</text>
      <text x="176" y="84">V</text>
      <text x="212" y="84">S</text>
      <text x="248" y="84">D</text>
    </g>
    <!-- Date numbers -->
    <g font-family="Inter, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="middle">
      <text x="32" y="106">1</text><text x="68" y="106">2</text><text x="104" y="106">3</text>
      <text x="140" y="106">4</text><text x="176" y="106">5</text><text x="212" y="106">6</text><text x="248" y="106">7</text>
      <text x="32" y="138">8</text><text x="68" y="138">9</text><text x="104" y="138">10</text>
      <text x="140" y="138">11</text><text x="176" y="138">12</text><text x="212" y="138">13</text><text x="248" y="138">14</text>
      <text x="32" y="170">15</text><text x="68" y="170">16</text><text x="104" y="170">17</text>
      <text x="140" y="170">18</text><text x="176" y="170">19</text><text x="212" y="170">20</text><text x="248" y="170">21</text>
      <text x="32" y="202">22</text><text x="68" y="202">23</text><text x="104" y="202">24</text>
      <text x="140" y="202">25</text><text x="176" y="202">26</text><text x="212" y="202">27</text><text x="248" y="202">28</text>
    </g>
    <!-- Highlighted appointment days -->
    <circle cx="68" cy="135" r="13" fill="url(#gold)" filter="url(#soft-shadow)"/>
    <text x="68" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#0f4c4c" font-weight="700">9</text>
    <circle cx="176" cy="167" r="13" fill="#0f4c4c"/>
    <text x="176" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#fff" font-weight="700">19</text>
    <circle cx="140" cy="199" r="13" fill="url(#gold)"/>
    <text x="140" y="202" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#0f4c4c" font-weight="700">25</text>
    <!-- Bottom of calendar -->
    <rect x="0" y="240" width="260" height="40" fill="#f5f1ea" rx="0"/>
    <rect x="0" y="240" width="260" height="2" fill="#d4cfc4"/>
    <text x="130" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5a5040" letter-spacing="2">3 CITAS PLANIFICADAS</text>
  </g>
  <!-- Checklist card (overlapping right) -->
  <g transform="translate(320 110)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="220" height="240" fill="url(#cal-paper)" rx="6"/>
    <rect x="0" y="0" width="220" height="6" fill="url(#gold)" rx="6"/>
    <text x="20" y="34" font-family="Inter, sans-serif" font-size="12" fill="#0f4c4c" font-weight="700">Plan escrito</text>
    <g transform="translate(20 60)">
      <!-- Done items -->
      <g transform="translate(0 0)">
        <circle cx="10" cy="10" r="9" fill="#0f4c4c"/>
        <path d="M 5 10 L 9 14 L 15 7" stroke="#c9a84c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="26" y="6" width="120" height="3" fill="#9a8c7e"/>
        <rect x="26" y="12" width="80" height="3" fill="#c9a84c"/>
      </g>
      <g transform="translate(0 40)">
        <circle cx="10" cy="10" r="9" fill="#0f4c4c"/>
        <path d="M 5 10 L 9 14 L 15 7" stroke="#c9a84c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="26" y="6" width="140" height="3" fill="#9a8c7e"/>
        <rect x="26" y="12" width="100" height="3" fill="#c9a84c"/>
      </g>
      <g transform="translate(0 80)">
        <circle cx="10" cy="10" r="9" fill="#0f4c4c"/>
        <path d="M 5 10 L 9 14 L 15 7" stroke="#c9a84c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="26" y="6" width="100" height="3" fill="#9a8c7e"/>
        <rect x="26" y="12" width="120" height="3" fill="#c9a84c"/>
      </g>
      <!-- Pending items -->
      <g transform="translate(0 120)">
        <circle cx="10" cy="10" r="9" fill="none" stroke="#9a8c7e" stroke-width="1.5"/>
        <rect x="26" y="6" width="110" height="3" fill="#9a8c7e"/>
        <rect x="26" y="12" width="80" height="3" fill="#9a8c7e"/>
      </g>
      <g transform="translate(0 160)">
        <circle cx="10" cy="10" r="9" fill="none" stroke="#9a8c7e" stroke-width="1.5"/>
        <rect x="26" y="6" width="130" height="3" fill="#9a8c7e"/>
        <rect x="26" y="12" width="100" height="3" fill="#9a8c7e"/>
      </g>
    </g>
  </g>
  <!-- Decorative dashed line connecting the two -->
  <path d="M 320 280 Q 360 320, 420 280" stroke="url(#gold)" stroke-width="2" stroke-dasharray="3 5" fill="none" opacity="0.6"/>
</svg>
