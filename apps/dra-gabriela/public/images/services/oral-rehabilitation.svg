<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Oral rehabilitation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3a3a"/>
      <stop offset="1" stop-color="#0a2020"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8c0b0"/>
      <stop offset="0.5" stop-color="#a89c80"/>
      <stop offset="1" stop-color="#5a5040"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f5f1ea"/>
      <stop offset="1" stop-color="#d4cfc4"/>
    </linearGradient>
    <linearGradient id="crown-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b265"/>
      <stop offset="1" stop-color="#a88a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#lamp)"/>
  <ellipse cx="300" cy="220" rx="180" ry="140" fill="url(#glow)"/>
  <!-- 3D-style dental implant + crown -->
  <g transform="translate(300 220)" filter="url(#soft-shadow)">
    <!-- Crown (white tooth-shaped) -->
    <g transform="translate(0 -60)">
      <path d="M -45 0
               C -50 -25, -30 -40, 0 -40
               C 30 -40, 50 -25, 45 0
               C 45 20, 40 50, 35 60
               C 30 70, 20 75, 10 70
               C 5 65, 0 50, 0 30
               C 0 50, -5 65, -10 70
               C -20 75, -30 70, -35 60
               C -40 50, -45 20, -45 0 Z"
            fill="url(#crown)"/>
      <!-- Crown shine -->
      <ellipse cx="-15" cy="-22" rx="12" ry="6" fill="url(#crown-shine)"/>
      <!-- Crown gold trim at base -->
      <ellipse cx="0" cy="0" rx="45" ry="6" fill="url(#gold)" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="45" ry="6" fill="none" stroke="#a88a3a" stroke-width="1"/>
    </g>
    <!-- Abutment (titanium connector) -->
    <g transform="translate(0 6)">
      <path d="M -16 -8 L -14 14 L 14 14 L 16 -8 Z" fill="url(#titanium)"/>
      <line x1="-14" y1="-4" x2="14" y2="-4" stroke="#5a5040" stroke-width="0.5"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#5a5040" stroke-width="0.5"/>
      <line x1="-14" y1="4" x2="14" y2="4" stroke="#5a5040" stroke-width="0.5"/>
    </g>
    <!-- Implant screw (titanium threaded) -->
    <g transform="translate(0 30)">
      <path d="M -14 -10 L -12 80 C -10 90, 10 90, 12 80 L 14 -10 Z" fill="url(#titanium)"/>
      <!-- Threading -->
      <path d="M -12 -4 L 12 -4" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 4 L 12 4" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 12 L 12 12" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 20 L 12 20" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 28 L 12 28" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 36 L 12 36" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 44 L 12 44" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 52 L 12 52" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 60 L 12 60" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <path d="M -12 68 L 12 68" stroke="#5a5040" stroke-width="1.5" fill="none"/>
      <!-- Highlight on screw -->
      <ellipse cx="-6" cy="20" rx="2" ry="40" fill="#fff" opacity="0.4"/>
    </g>
    <!-- Tip of implant -->
    <ellipse cx="0" cy="120" rx="6" ry="3" fill="#3a3020"/>
  </g>
  <!-- Subtle particles -->
  <g fill="#c9a84c" opacity="0.3">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="480" cy="100" r="1"/>
    <circle cx="100" cy="320" r="1.5"/>
    <circle cx="500" cy="280" r="1"/>
  </g>
  <text x="300" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#c9a84c" letter-spacing="4" opacity="0.6">REHABILITACIÓN ORAL</text>
</svg>
