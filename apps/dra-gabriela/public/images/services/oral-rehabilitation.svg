<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Oral rehabilitation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3a3a"/>
      <stop offset="1" stop-color="#1a6a6a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <!-- Crown schematic -->
  <g transform="translate(300 200)">
    <!-- Imprint base -->
    <ellipse cx="0" cy="60" rx="140" ry="20" fill="#1a1a1a" opacity="0.3"/>
    <!-- Implant post (titanium screw) -->
    <g transform="translate(-40 0)">
      <rect x="-8" y="-60" width="16" height="120" fill="#a89c80" rx="2"/>
      <line x1="-8" y1="-40" x2="8" y2="-40" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="-20" x2="8" y2="-20" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="20" x2="8" y2="20" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="40" x2="8" y2="40" stroke="#0a0a0a" stroke-width="1"/>
      <ellipse cx="0" cy="-60" rx="8" ry="4" fill="#5a5040"/>
    </g>
    <!-- Crown (white) -->
    <g transform="translate(-40 -100)">
      <path d="M -30 0 L -25 60 L 25 60 L 30 0 Q 30 -30, 0 -30 Q -30 -30, -30 0 Z" fill="#fbf9f6" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.3))"/>
      <path d="M -30 0 L -25 60 L 25 60 L 30 0" fill="none" stroke="#c9a84c" stroke-width="2"/>
      <ellipse cx="-15" cy="-10" rx="6" ry="4" fill="#fff" opacity="0.6"/>
    </g>
    <!-- Crown 2 -->
    <g transform="translate(40 0)">
      <rect x="-8" y="-60" width="16" height="120" fill="#a89c80" rx="2"/>
      <line x1="-8" y1="-40" x2="8" y2="-40" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="-20" x2="8" y2="-20" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="20" x2="8" y2="20" stroke="#0a0a0a" stroke-width="1"/>
      <line x1="-8" y1="40" x2="8" y2="40" stroke="#0a0a0a" stroke-width="1"/>
      <ellipse cx="0" cy="-60" rx="8" ry="4" fill="#5a5040"/>
    </g>
    <g transform="translate(40 -100)">
      <path d="M -30 0 L -25 60 L 25 60 L 30 0 Q 30 -30, 0 -30 Q -30 -30, -30 0 Z" fill="#fbf9f6" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.3))"/>
      <path d="M -30 0 L -25 60 L 25 60 L 30 0" fill="none" stroke="#c9a84c" stroke-width="2"/>
      <ellipse cx="-15" cy="-10" rx="6" ry="4" fill="#fff" opacity="0.6"/>
    </g>
    <!-- Connection bridge -->
    <rect x="-40" y="-90" width="80" height="6" fill="#fbf9f6" opacity="0.8" stroke="#c9a84c" stroke-width="1"/>
  </g>
  <text x="300" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#c9a84c" letter-spacing="4" font-weight="600">REHABILITACIÓN ORAL</text>
</svg>
