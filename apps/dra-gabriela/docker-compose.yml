services:
  web:
    image: dra-gabriela:prod
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        # Primary router — ometzdental.com (apex only)
        - "traefik.http.routers.dra-gabriela.entrypoints=websecure"
        - "traefik.http.routers.dra-gabriela.rule=Host(`ometzdental.com`)"
        - "traefik.http.routers.dra-gabriela.tls=true"
        - "traefik.http.routers.dra-gabriela.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.dra-gabriela.middlewares=security-headers@file"
        # WWW redirect — www.ometzdental.com → ometzdental.com (301)
        - "traefik.http.routers.dra-gabriela-www.entrypoints=websecure"
        - "traefik.http.routers.dra-gabriela-www.rule=Host(`www.ometzdental.com`)"
        - "traefik.http.routers.dra-gabriela-www.tls=true"
        - "traefik.http.routers.dra-gabriela-www.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.dra-gabriela-www.middlewares=dra-gabriela-www-redirect@docker,security-headers@file"
        - "traefik.http.middlewares.dra-gabriela-www-redirect.redirectregex.regex=^https?://www\\.ometzdental\\.com/(.*)"
        - "traefik.http.middlewares.dra-gabriela-www-redirect.redirectregex.replacement=https://ometzdental.com/$${1}"
        - "traefik.http.middlewares.dra-gabriela-www-redirect.redirectregex.permanent=true"
        # Legacy redirect — dragabriela.paragu-ai.com → ometzdental.com (301)
        - "traefik.http.routers.dra-gabriela-legacy.entrypoints=websecure"
        - "traefik.http.routers.dra-gabriela-legacy.rule=Host(`dragabriela.paragu-ai.com`) || Host(`dra-gabriela.com.py`) || Host(`www.dra-gabriela.com.py`)"
        - "traefik.http.routers.dra-gabriela-legacy.tls=true"
        - "traefik.http.routers.dra-gabriela-legacy.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.dra-gabriela-legacy.middlewares=dra-gabriela-legacy-redirect@docker"
        - "traefik.http.middlewares.dra-gabriela-legacy-redirect.redirectregex.regex=^https?://(dragabriela\\.paragu-ai\\.com|dra-gabriela\\.com\\.py|www\\.dra-gabriela\\.com\\.py)/?(.*)"
        - "traefik.http.middlewares.dra-gabriela-legacy-redirect.redirectregex.replacement=https://ometzdental.com/$${1}"
        - "traefik.http.middlewares.dra-gabriela-legacy-redirect.redirectregex.permanent=true"
        - "traefik.http.services.dra-gabriela.loadbalancer.server.port=3000"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
