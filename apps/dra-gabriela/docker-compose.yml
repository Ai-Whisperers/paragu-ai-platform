services:
  web:
    image: dra-gabriela:prod-cover-20260714
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        # Primary router — ometzdental.com (apex only)
        - "traefik.http.routers.dra-gabriela.entrypoints=websecure"
        - "traefik.http.routers.dra-gabriela.rule=Host(`ometzdental.com`)"
        - "traefik.http.routers.dra-gabriela.tls=true"
        - "traefik.http.routers.dra-gabriela.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.dra-gabriela.middlewares=security-headers@file"
        # WWW redirect — www.ometzdental.com → ometzdental.com (301)
        - "traefik.http.routers.dra-gabriela-www.entrypoints=websecure"
        - "traefik.http.routers.dra-gabriela-www.rule=Host(`www.ometzdental.com`)"
        - "traefik.http.routers.dra-gabriela-www.tls=true"
        - "traefik.http.routers.dra-gabriela-www.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.dra-gabriela-www.middlewares=dra-gabriela-www-redirect@file,security-headers@file"
        # Legacy redirect — ometzdental.com → ometzdental.com (301)
        # NOTE: For now, ometzdental.com serves the site directly
        # because ometzdental.com DNS does not currently point to this VPS.
        # Restore the legacy redirect once ometzdental.com is live.
        - "traefik.http.routers.dra-gabriela-legacy.entrypoints=websecure"
        - "traefik.http.routers.dra-gabriela-legacy.rule=Host(`ometzdental.com.py`) || Host(`www.ometzdental.com.py`)"
        - "traefik.http.routers.dra-gabriela-legacy.tls=true"
        - "traefik.http.routers.dra-gabriela-legacy.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.dra-gabriela-legacy.middlewares=dra-gabriela-legacy-redirect@file"
        # Secondary router — dragabriela.paragu-ai.com (legacy alias) → 301 to ometzdental.com
        - "traefik.http.routers.dra-gabriela-pa.entrypoints=websecure"
        - "traefik.http.routers.dra-gabriela-pa.rule=Host(`dragabriela.paragu-ai.com`)"
        - "traefik.http.routers.dra-gabriela-pa.tls=true"
        - "traefik.http.routers.dra-gabriela-pa.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.dra-gabriela-pa.middlewares=dra-gabriela-pa-redirect@file"
        # Middleware: redirect dragabriela.paragu-ai.com → ometzdental.com (301)
        - "traefik.http.services.dra-gabriela.loadbalancer.server.port=3000"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
