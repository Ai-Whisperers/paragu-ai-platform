services:
  web:
    image: trentina-site:prod
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.trentina-site.entrypoints=websecure"
        - "traefik.http.routers.trentina-site.rule=Host(`trentina-site.paragu-ai.com`)"
        - "traefik.http.routers.trentina-site.tls=true"
        - "traefik.http.routers.trentina-site.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.trentina-site.middlewares=security-headers@file"
        - "traefik.http.services.trentina-site.loadbalancer.server.port=3000"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
