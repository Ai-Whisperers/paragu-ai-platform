name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /tmp && rm -rf villamayor && git clone https://github.com/Ai-Whisperers/villamayor-asociados.git villamayor
            cd villamayor && docker build -t villamayor:prod .
            docker service update --force villamayor_web
