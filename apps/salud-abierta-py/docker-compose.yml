version: "3.9"

# ── SaludAbierta PY — Host A Swarm stack ──
# Serves the real Next.js site on salud-abierta.paragu-ai.com.
# Architecture: Next.js standalone (NOT export) → Docker Swarm → Traefik.
#
# Pre-flight on Host A:
#   mkdir -p /opt/stacks/salud-abierta-py
#   (compose file lives here)
#
# DNS: A record salud-abierta.paragu-ai.com → 38.9.96.179 (grey-cloud for LE)
#
# Traefik gotchas (see deploy.sh + vps-aiw-static-deploy skill):
#   - Labels MUST be at deploy.labels level (service-level)
#   - Traefik service name must match: ${APP_NAME} = "salud-abierta-py" but
#     Traefik docker provider doesn't accept dots in service names → use
#     "salud-abierta" as the Traefik service identifier.

services:
  web:
    image: salud-abierta-py:prod
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        # Subdomain router — salud-abierta.paragu-ai.com
        - "traefik.http.routers.salud-abierta.entrypoints=websecure"
        - "traefik.http.routers.salud-abierta.rule=Host(`salud-abierta.paragu-ai.com`)"
        - "traefik.http.routers.salud-abierta.tls=true"
        - "traefik.http.routers.salud-abierta.tls.certresolver=le"
        - "traefik.http.routers.salud-abierta.service=salud-abierta"
        # Preview router — salud-abierta-preview.paragu-ai.com
        - "traefik.http.routers.salud-abierta-preview.entrypoints=websecure"
        - "traefik.http.routers.salud-abierta-preview.rule=Host(`salud-abierta-preview.paragu-ai.com`)"
        - "traefik.http.routers.salud-abierta-preview.tls=true"
        - "traefik.http.routers.salud-abierta-preview.tls.certresolver=le"
        - "traefik.http.routers.salud-abierta-preview.service=salud-abierta"
        # Service definition (port 3000 inside container)
        - "traefik.http.services.salud-abierta.loadbalancer.server.port=3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://salud-abierta.paragu-ai.com
      - NEXT_PUBLIC_SITE_URL=https://salud-abierta.paragu-ai.com
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
