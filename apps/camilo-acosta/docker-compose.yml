services:
  web:
    image: camilo-acosta:prod
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.camilo-acosta.entrypoints=websecure"
        - "traefik.http.routers.camilo-acosta.rule=Host(`camilo-acosta.paragu-ai.com`)"
        - "traefik.http.routers.camilo-acosta.tls=true"
        - "traefik.http.routers.camilo-acosta.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.camilo-acosta.middlewares=security-headers@file"
        - "traefik.http.services.camilo-acosta.loadbalancer.server.port=3000"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
