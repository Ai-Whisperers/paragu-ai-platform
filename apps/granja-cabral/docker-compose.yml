services:
  web:
    build: .
    image: granja-cabral:prod
    ports:
      - "3000"
    networks:
      - agent-net
    environment:
      - NODE_ENV=production
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.granja-cabral.entrypoints=websecure"
        - "traefik.http.routers.granja-cabral.rule=Host(`granjacabral.paragu-ai.com`)"
        - "traefik.http.routers.granja-cabral.tls=true"
        - "traefik.http.routers.granja-cabral.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.granja-cabral.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  agent-net:
    external: true
