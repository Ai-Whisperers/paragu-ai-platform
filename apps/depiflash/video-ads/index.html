<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div class="clip" data-start="0" data-duration="9" data-track-index="1" data-composition-id="depiflash-hook-sin-dolor" data-composition-src="compositions/hook-sin-dolor.html"></div>
      <div class="clip" data-start="0" data-duration="5" data-track-index="2" data-composition-id="depiflash-urgente-horarios" data-composition-src="compositions/urgente-2-horarios.html"></div>
      <div class="clip" data-start="0" data-duration="8" data-track-index="3" data-composition-id="depiflash-domicilio" data-composition-src="compositions/domicilio.html"></div>
      <div class="clip" data-start="0" data-duration="6" data-track-index="4" data-composition-id="depiflash-precio-axilas" data-composition-src="compositions/precio-axilas.html"></div>
      <div class="clip" data-start="0" data-duration="8" data-track-index="5" data-composition-id="depiflash-precios-rapidos" data-composition-src="compositions/precios-rapidos.html"></div>
      <div class="clip" data-start="0" data-duration="9" data-track-index="6" data-composition-id="depiflash-resultados" data-composition-src="compositions/resultados.html"></div>
      <div class="clip" data-start="0" data-duration="10" data-track-index="7" data-composition-id="depiflash-vs-cera" data-composition-src="compositions/vs-cera.html"></div>
      <div class="clip" data-start="0" data-duration="7" data-track-index="8" data-composition-id="depiflash-15-min" data-composition-src="compositions/duracion-15min.html"></div>
      <div class="clip" data-start="0" data-duration="8" data-track-index="9" data-composition-id="depiflash-estudiantes" data-composition-src="compositions/estudiantes.html"></div>
      <div class="clip" data-start="0" data-duration="10" data-track-index="10" data-composition-id="depiflash-reafirmacion" data-composition-src="compositions/reafirmacion.html"></div>
      <div class="clip" data-start="0" data-duration="12" data-track-index="11" data-composition-id="depiflash-contraindicaciones" data-composition-src="compositions/contraindicaciones.html"></div>
      <div class="clip" data-start="0" data-duration="7" data-track-index="12" data-composition-id="depiflash-regalo" data-composition-src="compositions/regalo.html"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
