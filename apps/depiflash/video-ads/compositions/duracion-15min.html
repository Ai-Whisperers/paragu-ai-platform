<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, .scene-content { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; }
    .scene-content {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; gap: 25px; padding: 80px;
    }
    .logo { position: absolute; top: 60px; left: 60px; font-family: 'Playfair Display', serif; font-size: 28px; color: #E8A0BF; font-weight: 700; }
    .emoji-big { font-size: 70px; }
    .heading { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 700; color: #1A1A2E; text-align: center; }
    .sub-text { font-size: 28px; font-weight: 500; color: #666; text-align: center; }
    .timer-card {
      background: #FFF0F5; border-radius: 24px; padding: 40px; width: 600px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .timer-zone { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: #1A1A2E; }
    .timer-time { font-size: 36px; font-weight: 700; color: #E8A0BF; }
    .kicker { font-size: 22px; font-weight: 500; color: #E8A0BF; text-align: center; }
  </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
<div data-composition="depiflash-15-min" data-composition-id="depiflash-15-min" data-width="1080" data-height="1920">


  <div class="clip scene-content" data-track-index="1" data-start="0" data-duration="7" style="background:#FFFFFF;">
    <div class="logo">DepiFlash ⚡</div>
    <div class="emoji-big" id="s1-emoji" style="opacity:0;">💨</div>
    <div class="heading" id="s1-head" style="opacity:0;">Sesiones exprés</div>
    <div class="timer-card" id="s1-card1" style="opacity:0; transform:scaleY(0);">
      <div class="timer-zone">Labio superior</div>
      <div class="timer-time">~10 min</div>
    </div>
    <div class="timer-card" id="s1-card2" style="opacity:0; transform:scaleY(0);">
      <div class="timer-zone">Axilas</div>
      <div class="timer-time">~15 min</div>
    </div>
    <div class="timer-card" id="s1-card3" style="opacity:0; transform:scaleY(0);">
      <div class="timer-zone">Bikini</div>
      <div class="timer-time">~15 min</div>
    </div>
    <div class="kicker" id="s1-kicker" style="opacity:0;">En tu hora de almuerzo 🕐</div>
  </div>


<script>
window.__timelines = window.__timelines || {};
(function() {
  var tl = gsap.timeline({ paused: true });
  window.__timelines["depiflash-15-min"] = tl;

  tl.to("#s1-emoji", { scale: 1, opacity: 1, duration: 0.5, ease: "elastic.out(1, 0.3)" }, 0.3);
  tl.from("#s1-head", { y: -20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.9);
  tl.to("#s1-card1", { scaleY: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" }, 1.6);
  tl.to("#s1-card2", { scaleY: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" }, 2.1);
  tl.to("#s1-card3", { scaleY: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" }, 2.6);
  tl.from("#s1-kicker", { y: 15, opacity: 0, duration: 0.4, ease: "power2.out" }, 4.0);
})();


// HyperFrames runtime bridge
window.__hf = {
  duration: (function() {
    var max = 0;
    Object.values(window.__timelines).forEach(function(tl) {
      var d = tl.totalDuration();
      if (d > max) max = d;
    });
    return max;
  })(),
  seek: function(time) {
    Object.values(window.__timelines).forEach(function(tl) {
      tl.seek(time);
    });
  }
};
</script>
</body>
</html>
