<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, .scene-content { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; }
    .scene-content {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; gap: 30px; padding: 80px;
    }
    .logo {
      position: absolute; top: 60px; left: 60px; font-family: 'Playfair Display', serif; font-size: 28px; color: white; font-weight: 700;
    }
    .emoji-big { font-size: 80px; line-height: 1; }
    .heading { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 700; color: #fff; text-align: center; line-height: 1.1; }
    .sub-heading { font-size: 40px; font-weight: 500; color: #fff; text-align: center; }
    .body-w { font-size: 28px; font-weight: 400; color: #fff; text-align: center; }
    .cta-badge {
      position: absolute; bottom: 200px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
      padding: 20px 50px; border-radius: 50px; font-size: 28px; font-weight: 600; color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .circle-deco {
      position: absolute; border-radius: 50%; opacity: 0.15;
    }
  </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
<div data-composition="depiflash-urgente-horarios" data-composition-id="depiflash-urgente-horarios" data-width="1080" data-height="1920">


  <!-- Scene 1: ⚡ HOY - 2 horarios -->
  <div class="clip scene-content" data-track-index="1" data-start="0" data-duration="3.5" style="background:#E8A0BF;">
    <div class="logo">DepiFlash ⚡</div>
    <div class="emoji-big" id="s1-emoji" style="opacity:0;">⚡</div>
    <div class="heading" id="s1-heading" style="opacity:0;">HOY</div>
    <div class="sub-heading" id="s1-sub" style="opacity:0;">2 horarios libres</div>
    <div class="circle-deco" style="width:250px; height:250px; background:#C4A4D4; top:200px; right:-80px;"></div>
    <div class="circle-deco" style="width:150px; height:150px; background:#C4A4D4; bottom:400px; left:-40px;"></div>
    <div class="circle-deco" style="width:100px; height:100px; background:#C4A4D4; top:600px; left:200px;"></div>
  </div>

  <!-- Scene 2: CTA -->
  <div class="clip scene-content" data-track-index="2" data-start="3.5" data-duration="1.5" style="background:linear-gradient(135deg,#E8A0BF,#C4A4D4);">
    <div class="logo">DepiFlash ⚡</div>
    <div class="body-w" id="s2-text" style="opacity:0;">Primer mensaje, primer turno 🏃‍♂️</div>
    <div class="cta-badge" id="s2-cta" style="opacity:0;">📲 Escribime ahora</div>
  </div>


<script>
window.__timelines = window.__timelines || {};
(function() {
  var tl = gsap.timeline({ paused: true });
  window.__timelines["depiflash-urgente-horarios"] = tl;

  // Scene 1: ⚡ + HOY + 2 horarios
  tl.to("#s1-emoji", { scale: 1, opacity: 1, duration: 0.5, ease: "elastic.out(1, 0.3)" }, 0.2);
  tl.from("#s1-heading", { y: -40, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.8);
  tl.from("#s1-sub", { y: 30, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.3);
  tl.to("#s1-heading", { scale: 1.05, duration: 0.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.2);

  // Scene 2: CTA
  tl.from("#s2-text", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 3.7);
  tl.to("#s2-cta", { scale: 1, opacity: 1, duration: 0.5, ease: "elastic.out(1, 0.4)" }, 4.2);
  tl.to("#s2-cta", { scale: 1.08, duration: 0.6, ease: "sine.inOut", repeat: 1, yoyo: true }, 4.9);
})();


// HyperFrames runtime bridge
window.__hf = {
  duration: (function() {
    var max = 0;
    Object.values(window.__timelines).forEach(function(tl) {
      var d = tl.totalDuration();
      if (d > max) max = d;
    });
    return max;
  })(),
  seek: function(time) {
    Object.values(window.__timelines).forEach(function(tl) {
      tl.seek(time);
    });
  }
};
</script>
</body>
</html>
