<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, .scene-content { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; }
    .scene-content {
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      position: relative; padding: 80px;
    }
    .half { width: 50%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; }
    .half-left { background: #ffebee; }
    .half-right { background: #e8f5e9; }
    .label-bad { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; color: #e53935; }
    .label-good { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700; color: #4CAF50; }
    .reason-text { font-size: 24px; font-weight: 400; color: #666; text-align: center; }
    .arrow-icon { font-size: 60px; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .body-w { font-size: 28px; font-weight: 500; color: #fff; text-align: center; }
    .cta-badge {
      position: absolute; bottom: 200px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
      padding: 20px 50px; border-radius: 50px; font-size: 28px; font-weight: 600; color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
    }
  </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
<div data-composition="depiflash-vs-cera" data-composition-id="depiflash-vs-cera" data-width="1080" data-height="1920">


  <!-- Scene 1: Split screen Cera vs IPL -->
  <div class="clip scene-content" data-track-index="1" data-start="0" data-duration="6" style="background:transparent; padding:0;">
    <div class="half half-left" id="s1-left" style="opacity:0;">
      <div class="label-bad">❌ Cera</div>
      <div class="reason-text" id="s1-left-text" style="opacity:0;">Duele<br>Cada mes<br>Vellos encarnados</div>
    </div>
    <div class="half half-right" id="s1-right" style="opacity:0;">
      <div class="label-good">✅ IPL</div>
      <div class="reason-text" id="s1-right-text" style="opacity:0;">Sin dolor<br>Permanente<br>Piel suave</div>
    </div>
    <div class="arrow-icon" id="s1-arrow" style="opacity:0;">➡️</div>
  </div>

  <!-- Scene 2: CTA -->
  <div class="clip scene-content" data-track-index="2" data-start="6" data-duration="4" style="background:linear-gradient(135deg,#E8A0BF,#C4A4D4);">
    <div class="body-w" style="font-family:'Playfair Display',serif; font-size:44px; font-weight:700;" id="s2-head">La mejor inversión</div>
    <div class="body-w" id="s2-text">Decile adiós a la cera para siempre ✨</div>
    <div class="cta-badge" style="bottom:250px; margin-top:40px;" id="s2-cta">📲 Pasate al IPL</div>
  </div>


<script>
window.__timelines = window.__timelines || {};
(function() {
  var tl = gsap.timeline({ paused: true });
  window.__timelines["depiflash-vs-cera"] = tl;

  // Scene 1: Split
  tl.to("#s1-left", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
  tl.to("#s1-right", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
  tl.from("#s1-left-text", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 0.8);
  tl.from("#s1-right-text", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 1.2);
  tl.to("#s1-arrow", { opacity: 1, scale: 1.3, duration: 0.5, ease: "elastic.out(1,0.3)" }, 2.5);
  tl.to(["#s1-left", "#s1-right", "#s1-arrow"], { opacity: 0, duration: 0.3 }, 5.6);

  // Scene 2
  tl.from("#s2-head", { y: -30, opacity: 0, duration: 0.5, ease: "power2.out" }, 6.3);
  tl.from("#s2-text", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 6.9);
  tl.to("#s2-cta", { scale: 1.05, duration: 0.6, repeat: 1, yoyo: true, ease: "sine.inOut" }, 8.0);
})();


// HyperFrames runtime bridge
window.__hf = {
  duration: (function() {
    var max = 0;
    Object.values(window.__timelines).forEach(function(tl) {
      var d = tl.totalDuration();
      if (d > max) max = d;
    });
    return max;
  })(),
  seek: function(time) {
    Object.values(window.__timelines).forEach(function(tl) {
      tl.seek(time);
    });
  }
};
</script>
</body>
</html>
