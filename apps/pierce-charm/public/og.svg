<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1230"/>
      <stop offset="50%" stop-color="#0a0612"/>
      <stop offset="100%" stop-color="#14091f"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b1a31" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b1a31" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow2" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#520b4e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#520b4e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b1a31"/>
      <stop offset="100%" stop-color="#520b4e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-glow2)"/>

  <!-- Top border -->
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#8b1a31" stroke-width="1" opacity="0.5"/>
  <circle cx="600" cy="40" r="4" fill="#b08838"/>
  <circle cx="540" cy="40" r="2.5" fill="#b08838" opacity="0.6"/>
  <circle cx="660" cy="40" r="2.5" fill="#b08838" opacity="0.6"/>

  <!-- Left chain -->
  <g opacity="0.45" stroke="#8b1a31" stroke-width="2" fill="none">
