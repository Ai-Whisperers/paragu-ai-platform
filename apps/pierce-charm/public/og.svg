    <ellipse cx="60" cy="140"  rx="22" ry="9"/>
    <ellipse cx="60" cy="180"  rx="22" ry="9"/>
    <ellipse cx="60" cy="220"  rx="22" ry="9"/>
    <ellipse cx="60" cy="260"  rx="22" ry="9"/>
    <ellipse cx="60" cy="300"  rx="22" ry="9"/>
    <ellipse cx="60" cy="340"  rx="22" ry="9"/>
    <ellipse cx="60" cy="380"  rx="22" ry="9"/>
    <ellipse cx="60" cy="420"  rx="22" ry="9"/>
    <ellipse cx="60" cy="460"  rx="22" ry="9"/>
    <ellipse cx="60" cy="500"  rx="22" ry="9"/>
    <ellipse cx="60" cy="540"  rx="22" ry="9"/>
  </g>

  <!-- Right chain -->
  <g opacity="0.45" stroke="#8b1a31" stroke-width="2" fill="none">
    <ellipse cx="1140" cy="120" rx="22" ry="9"/>
    <ellipse cx="1140" cy="160" rx="22" ry="9"/>
    <ellipse cx="1140" cy="200" rx="22" ry="9"/>
    <ellipse cx="1140" cy="240" rx="22" ry="9"/>
    <ellipse cx="1140" cy="280" rx="22" ry="9"/>
    <ellipse cx="1140" cy="320" rx="22" ry="9"/>
    <ellipse cx="1140" cy="360" rx="22" ry="9"/>
    <ellipse cx="1140" cy="400" rx="22" ry="9"/>
    <ellipse cx="1140" cy="440" rx="22" ry="9"/>
    <ellipse cx="1140" cy="480" rx="22" ry="9"/>
    <ellipse cx="1140" cy="520" rx="22" ry="9"/>
  </g>

  <!-- Bats in corners -->
  <g fill="#8b1a31" opacity="0.7">
    <path d="M180 140 L178 142 C 168 138 158 142 154 148 C 158 145 162 145 166 148 C 165 145 168 144 172 146 L 174 145 L 176 146 C 180 144 183 145 182 148 C 186 145 190 145 194 148 C 190 142 180 138 178 142 Z"/>
    <path d="M1020 510 L1018 512 C 1008 508 998 512 994 518 C 998 515 1002 515 1006 518 C 1005 515 1008 514 1012 516 L 1014 515 L 1016 516 C 1020 514 1023 515 1022 518 C 1026 515 1030 515 1034 518 C 1030 512 1020 508 1018 512 Z"/>
  </g>

  <!-- Diamond logo + brand center -->
  <g transform="translate(600 320)">
    <rect x="-100" y="-100" width="200" height="200" transform="rotate(45)" fill="none" stroke="url(#og-diamond)" stroke-width="4"/>
    <rect x="-86" y="-86" width="172" height="172" transform="rotate(45)" fill="none" stroke="#b08838" stroke-width="1" opacity="0.45"/>
    <text x="0" y="22" font-family="Georgia, serif" font-size="158" font-weight="700" fill="#b08838" text-anchor="middle">P</text>
  </g>

  <!-- Brand name -->
  <text x="600" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="700" fill="#f1e7ee" letter-spacing="14">PIERCE CHARM</text>

  <!-- Tagline script -->
  <text x="600" y="500" text-anchor="middle" font-family="cursive" font-size="44" font-weight="400" fill="#b08838" font-style="italic">⋆ piercings &amp; joyería alternativa ⋆</text>

  <!-- Location -->
  <text x="600" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#a89bb0" letter-spacing="8">ASUNCIÓN · PARAGUAY</text>

  <!-- Decorative bottom -->
  <text x="600" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7a6d80" letter-spacing="10">𓆩 ☆ 𓆪</text>
</svg>
