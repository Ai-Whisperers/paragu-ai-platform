<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="cy-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7834C0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4C2C73" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Outer frame -->
  <rect x="20" y="20" width="560" height="560" rx="12" fill="none" stroke="url(#cy-grad-1)" stroke-width="2"/>
  <rect x="40" y="40" width="520" height="520" rx="8" fill="none" stroke="#AF7AC9" stroke-width="0.5" stroke-opacity="0.5"/>
  <!-- Inner grid -->
  <g stroke="#AF7AC9" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="40" y1="120" x2="560" y2="120"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="40" y1="280" x2="560" y2="280"/>
    <line x1="40" y1="360" x2="560" y2="360"/>
    <line x1="40" y1="440" x2="560" y2="440"/>
    <line x1="40" y1="520" x2="560" y2="520"/>
    <line x1="120" y1="40" x2="120" y2="560"/>
    <line x1="200" y1="40" x2="200" y2="560"/>
    <line x1="280" y1="40" x2="280" y2="560"/>
    <line x1="360" y1="40" x2="360" y2="560"/>
    <line x1="440" y1="40" x2="440" y2="560"/>
    <line x1="520" y1="40" x2="520" y2="560"/>
  </g>
  <!-- Hex core -->
  <polygon points="300,180 380,225 380,315 300,360 220,315 220,225" fill="#7834C0" fill-opacity="0.25" stroke="#D2AE3F" stroke-width="2"/>
  <polygon points="300,210 360,243 360,297 300,330 240,297 240,243" fill="none" stroke="#AF7AC9" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Corner nodes -->
  <circle cx="40" cy="40" r="6" fill="#D2AE3F"/>
  <circle cx="560" cy="40" r="6" fill="#D2AE3F"/>
  <circle cx="40" cy="560" r="6" fill="#D2AE3F"/>
  <circle cx="560" cy="560" r="6" fill="#D2AE3F"/>
  <!-- Center pulse -->
  <circle cx="300" cy="270" r="14" fill="none" stroke="#D2AE3F" stroke-width="1.5"/>
  <circle cx="300" cy="270" r="6" fill="#D2AE3F"/>
  <!-- Connectors -->
  <line x1="40" y1="40" x2="220" y2="225" stroke="#AF7AC9" stroke-width="0.7" stroke-opacity="0.5"/>
  <line x1="560" y1="40" x2="380" y2="225" stroke="#AF7AC9" stroke-width="0.7" stroke-opacity="0.5"/>
  <line x1="40" y1="560" x2="220" y2="315" stroke="#AF7AC9" stroke-width="0.7" stroke-opacity="0.5"/>
  <line x1="560" y1="560" x2="380" y2="315" stroke="#AF7AC9" stroke-width="0.7" stroke-opacity="0.5"/>
</svg>
