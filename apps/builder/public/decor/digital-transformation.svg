<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="dt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7834C0"/>
      <stop offset="100%" stop-color="#4C2C73"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="200" cy="200" r="180" fill="url(#dt-grad)" fill-opacity="0.15" stroke="#AF7AC9" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#AF7AC9" stroke-width="0.7" stroke-opacity="0.5"/>
  <!-- Central cube -->
  <g transform="translate(200 200)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#4C2C73" stroke="#D2AE3F" stroke-width="2"/>
    <polygon points="0,-60 52,-30 0,0 -52,-30" fill="#7834C0" fill-opacity="0.5"/>
    <polygon points="0,0 52,-30 52,30 0,60" fill="none" stroke="#AF7AC9" stroke-width="1" stroke-opacity="0.7"/>
  </g>
  <!-- Orbital nodes -->
  <circle cx="200" cy="40" r="8" fill="#D2AE3F"/>
  <circle cx="360" cy="200" r="8" fill="#D2AE3F"/>
  <circle cx="200" cy="360" r="8" fill="#D2AE3F"/>
  <circle cx="40" cy="200" r="8" fill="#D2AE3F"/>
  <!-- Lines -->
  <line x1="200" y1="40" x2="200" y2="140" stroke="#AF7AC9" stroke-width="1"/>
  <line x1="360" y1="200" x2="260" y2="200" stroke="#AF7AC9" stroke-width="1"/>
  <line x1="200" y1="360" x2="200" y2="260" stroke="#AF7AC9" stroke-width="1"/>
  <line x1="40" y1="200" x2="140" y2="200" stroke="#AF7AC9" stroke-width="1"/>
</svg>
