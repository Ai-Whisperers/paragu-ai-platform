services:
  web:
    image: meal-prep:prod
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.meal-prep.entrypoints=websecure"
        - "traefik.http.routers.meal-prep.rule=Host(`meal-prep.paragu-ai.com`)"
        - "traefik.http.routers.meal-prep.tls=true"
        - "traefik.http.routers.meal-prep.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.meal-prep.middlewares=security-headers@file"
        - "traefik.http.services.meal-prep.loadbalancer.server.port=80"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
