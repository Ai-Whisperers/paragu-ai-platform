services:
  web:
    image: ozmontania-website:prod
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.ozmontania-website.entrypoints=websecure"
        - "traefik.http.routers.ozmontania-website.rule=Host(`ozmontania-website.paragu-ai.com`)"
        - "traefik.http.routers.ozmontania-website.tls=true"
        - "traefik.http.routers.ozmontania-website.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ozmontania-website.loadbalancer.server.port=3000"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
