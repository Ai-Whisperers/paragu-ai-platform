services:
  web:
    build: .
    image: ozmontania-website:prod
    ports:
      - "3000"
    networks:
      - agent-net
    environment:
      - NODE_ENV=production
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.ozmontania.entrypoints=websecure"
        - "traefik.http.routers.ozmontania.rule=Host(`ozmontania.paragu-ai.com`)"
        - "traefik.http.routers.ozmontania.tls=true"
        - "traefik.http.routers.ozmontania.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ozmontania.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  agent-net:
    external: true
