services:
  web:
    image: golden-visa-advisory:prod
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.golden-visa-advisory.entrypoints=websecure"
        - "traefik.http.routers.golden-visa-advisory.rule=Host(`golden-visa-advisory.paragu-ai.com`)"
        - "traefik.http.routers.golden-visa-advisory.tls=true"
        - "traefik.http.routers.golden-visa-advisory.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.golden-visa-advisory.middlewares=security-headers@file"
        - "traefik.http.services.golden-visa-advisory.loadbalancer.server.port=3000"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
