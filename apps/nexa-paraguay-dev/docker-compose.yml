# ── Nexa Paraguay DEV — Swarm stack (staging) ──
# This is the design-staging site. NOT the production site (that's nexa-paraguay).
# Reachable at dev.nexa.paragu-ai.com only. Used by Luana/Kiki to approve
# design proposals before promoting to live.
#
# Promote dev → live:
#   1. Finalize design in /root/paragu-ai-platform/apps/nexa-paraguay-dev
#   2. Cherry-pick or merge approved changes to /root/paragu-ai-platform/apps/nexa-paraguay
#   3. Deploy live via apps/nexa-paraguay/deploy.sh
#
# Deploy dev:
#   pnpm --filter nexa-paraguay-dev build
#   docker build -f apps/nexa-paraguay-dev/Dockerfile.standalone -t nexa-paraguay-dev:prod apps/nexa-paraguay-dev
#   docker service update --image nexa-paraguay-dev:prod-<ts> nexa-paraguay-dev_web

services:
  web:
    image: nexa-paraguay-dev:prod
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          cpus: '0.3'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://dev.nexa.paragu-ai.com
      - NEXT_PUBLIC_GA4_ID=
      - NEXT_PUBLIC_SUPABASE_URL=
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=
      - SUPABASE_SERVICE_ROLE_KEY=
      - NEXA_DEV_MODE=1
    volumes:
      - nexa-dev-leads:/app/.leads
      - nexa-dev-submissions:/app/data/submissions
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=agent-net"
      - "traefik.http.routers.nexa-paraguay-dev.entrypoints=websecure"
      - "traefik.http.routers.nexa-paraguay-dev.rule=Host(`dev.nexa.paragu-ai.com`)"
      - "traefik.http.routers.nexa-paraguay-dev.tls=true"
      - "traefik.http.routers.nexa-paraguay-dev.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.nexa-paraguay-dev.middlewares=security-headers@file"
      - "traefik.http.routers.nexa-paraguay-dev.service=nexa-paraguay-dev"
      - "traefik.http.services.nexa-paraguay-dev.loadbalancer.server.port=3000"
      - "traefik.http.services.nexa-paraguay-dev.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.nexa-paraguay-dev.loadbalancer.healthcheck.interval=30s"
    networks:
      - agent-net

volumes:
  nexa-dev-leads:
  nexa-dev-submissions:

networks:
  agent-net:
    external: true
