services:
  web:
    image: bufete-mendez:prod
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.bufete-mendez.entrypoints=websecure"
        - "traefik.http.routers.bufete-mendez.rule=Host(`bufete-mendez.paragu-ai.com`)"
        - "traefik.http.routers.bufete-mendez.tls=true"
        - "traefik.http.routers.bufete-mendez.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.bufete-mendez.middlewares=security-headers@file"
        - "traefik.http.services.bufete-mendez.loadbalancer.server.port=3000"
    networks:
      - agent-net
networks:
  agent-net:
    external: true
