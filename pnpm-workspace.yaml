packages:
  - 'packages/**'
  - 'apps/*'
  # Exclude accidentally-nested duplicates that share the parent package's
  # name (`@ai-whisperers/i18n`, `@ai-whisperers/content`). Both parent
  # packages ship an unbuilt `dist/`; the nested copies were never built and
  # collide on package name → pnpm may link to the empty one, breaking
  # downstream typecheck (nexa-paraguay can't resolve `@ai-whisperers/i18n`).
  - '!packages/@ai-whisperers/*/*/'

public-hoist-pattern:
  - 'next'
  - 'react'
  - 'react-dom'
  - '@types/*'

shared-workspace-lockfile: true
